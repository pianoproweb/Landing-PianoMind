  {
    id: 4,
    title: 'Memorizing, Testing and Preparing for the Stage',
    description: 'Memory encoding strategies grounded in neuroscience, combined with structured performance preparation protocols.',
    tag1: { label: 'ADVANCED', bg: '#080D1A', color: '#FFFFFF' },
    tag2: { label: 'MODULE 4', bg: '#D4A574', color: '#080D1A' },
    lessons: [
      { id: '4.1', vimeoId: '1196631385', title: 'Chunking',                                                        instructor: 'Michelangelo Salamone', duration: null, theory: "<p><strong>The principle.</strong> Try to memorize twelve isolated digits — 2, 8, 6, 2, 0, 2, 2, 1, 9, 3, 8, 6 — and it is hard. Reframe them as \"on the 28th of June 2022, at 19:38, I saw six children,\" and suddenly it is easy. The information did not change; only the <em>structure</em> holding it changed. You went from twelve isolated data points to one meaningful group. This is the foundation of <em>mental representation</em> — cognitive structures that are faster and easier to recall — and at the piano it is everything.</p><p>Applied to a Prokofiev cadenza with thousands of notes: if you rely on individual notes, you struggle. But ungroup the texture into lines — the bass has a line, the arpeggio a line, the melody a line — and you are no longer processing single-note sequences but groups, which relate to structure, movement, and harmonic or melodic patterns. This is what neuroscience calls <em>chunking</em>. A chunk is not a unit of notes or of measures — it is a <em>unit of meaning</em>. When you hear G major resolving to C major, you do not process ten separate notes; you recognize one thing: a resolution. That instant recognition, retrieved in milliseconds, is a chunk — and it carries connections to what came before and after, to the physical gesture, to the harmonic and melodic line.</p><p>The lesson shows this on Liszt's Transcendental Etudes — <em>Eroica</em>, <em>Feux follets</em>, <em>Mazeppa</em>: instead of thinking note by note or octave by octave, you group into first chunk, second chunk, resolution, and think in terms of the <em>gesture</em> of each group rather than its individual components. You manage groups, not notes.</p><p><strong>What the science says.</strong> <strong>Chunking</strong> is one of the most established concepts in cognitive psychology, traced to <strong>George Miller's</strong> work on the limits of working memory and developed in expertise research by <strong>Chase and Simon</strong>: experts perceive and recall material in meaningful groups, vastly expanding effective memory capacity. The notion of <strong>mental representations</strong> as the engine of expert recall is central to Ericsson's research. A chunk as a \"unit of meaning\" with rich connections is precisely how the expertise literature describes the structures that let masters retrieve complex material instantly.</p><p><strong>— Experiential Exercise —</strong></p><p>Take a dense passage you are memorizing note by note. Stop, and re-encode it as chunks: identify the units of <em>meaning</em> — a harmonic resolution, a melodic gesture, a repeated figure — and the separate lines (bass, harmony, melody) running through it. For each chunk, attach its connections: the gesture it requires, the harmonic function, what precedes and follows. Then recall the passage thinking only in chunks and gestures, never single notes. The exercise converts an unmanageable stream of notes into a small set of meaningful, instantly retrievable units — the structure expert memory actually uses.</p>", attachments: [], quiz: [{"question": "What changed when the twelve digits became a date and time?", "options": ["The number of digits", "The structure holding the information, not the information itself", "The difficulty of the digits", "Nothing"], "correct": 1, "explanation": "Re-structuring isolated data into one meaningful group is what makes it easy to recall."}, {"question": "What is a chunk?", "options": ["A group of four notes", "A unit of meaning, not a unit of notes or measures", "A single measure", "A memorized phrase"], "correct": 1, "explanation": "A chunk is defined by meaning and carries connections to gesture, harmony, and line."}, {"question": "How do you chunk a dense cadenza?", "options": ["Play it faster", "Ungroup it into lines and meaningful groups (bass, arpeggio, melody)", "Memorize every note", "Repeat it more"], "correct": 1, "explanation": "Grouping into lines and patterns replaces note-by-note processing."}, {"question": "When you hear G major resolving to C major, what do you process?", "options": ["Ten notes", "One thing — a resolution — not ten separate notes", "Two chords", "A scale"], "correct": 1, "explanation": "Recognized harmonic patterns are single chunks retrieved instantly."}, {"question": "Which researchers are central to chunking and working memory?", "options": ["Fitts and Posner", "Locke and Latham", "Miller, and Chase and Simon", "Sweller"], "correct": 2, "explanation": "Miller established working-memory limits; Chase and Simon studied expert chunking."}] },
      { id: '4.2', vimeoId: '1196631378', title: 'Memorization process',                                            instructor: 'Michelangelo Salamone', duration: null, theory: "<p><strong>The principle.</strong> Practical repetition alone is not enough to memorize reliably. A brain that recalls only motor patterns is developing a weakness. Reliable memory depends on <em>levels of processing</em>: more elaborated data equals more reliable memory. Rely on mechanical repetition alone and you leave thousands of data points on the table. Memorization unfolds in three phases.</p><p><em>Encoding</em>: you analyze deeply everything that happens in the score and collect data actively — conscious repetition, not mechanical repetition, is what makes this phase useful. <em>Consolidation</em>: crucially, repeated patterns consolidate not when you repeat them but when you <em>rest</em>. This is well documented — during deep sleep, the hippocampus replays the sequences you practiced that day and transfers them into long-term cortical storage. The cycle is: you learn, you encode, you rest, you consolidate. <em>Retrieval</em>: many pianists encode well, sleep, consolidate — and then assume the work is done, waiting until they know the piece \"perfectly\" before daring to play without the score. But retrieval is a muscle: every time you actively pull information out of memory, you make that neural pathway stronger and faster.</p><p>The practical consequence is that memorization is an active, three-part process, not passive repetition. You must encode consciously, protect sleep as a working phase of learning, and practice retrieval deliberately rather than waiting for certainty — because the act of retrieving is itself what strengthens the memory.</p><p><strong>What the science says.</strong> All three phases are strongly supported. <strong>Levels of processing</strong> comes from Craik and Lockhart: deeper, more elaborate processing produces more durable memory than shallow rehearsal. <strong>Sleep-dependent consolidation</strong> and <strong>hippocampal replay</strong> are well-documented findings in neuroscience — the hippocampus reactivates daytime sequences during sleep, transferring them to cortical storage. <strong>Retrieval practice</strong> (the testing effect, Roediger and Karpicke) confirms that actively retrieving information strengthens memory far more than restudying it.</p><p><strong>— Experiential Exercise —</strong></p><p>Restructure how you memorize one passage across the three phases. In <em>encoding</em>, work consciously: analyze the score's structure as you repeat, naming what you are learning rather than drilling on autopilot. Then deliberately <em>protect a sleep cycle</em> before judging the result — treat sleep as part of the practice, not a break from it. The next day, before re-studying, force <em>retrieval</em>: attempt to play or reconstruct the passage from memory, making the effort before checking the score. Repeat the cycle. The exercise replaces mechanical repetition with the active encode-consolidate-retrieve loop that actually builds durable memory.</p>", attachments: [], quiz: [{"question": "Why is practical repetition alone insufficient?", "options": ["It is too slow", "A brain recalling only motor patterns develops a weakness; reliable memory needs deeper processing", "It is too tiring", "It is too fast"], "correct": 1, "explanation": "More elaborated data equals more reliable memory; mechanical repetition leaves data unused."}, {"question": "When do repeated patterns consolidate?", "options": ["Only while repeating", "During rest and deep sleep, not during repetition", "Only when performing", "Never"], "correct": 1, "explanation": "The hippocampus replays and transfers sequences to long-term storage during sleep."}, {"question": "What are the three phases of memorization?", "options": ["Reading, playing, performing", "Encoding, consolidation, retrieval", "Kinesthetic, visual, auditory", "Slow, moderate, fast"], "correct": 1, "explanation": "You encode by analysis, consolidate in sleep, and strengthen via retrieval."}, {"question": "Why is retrieval described as a muscle?", "options": ["It gets tired", "Each active retrieval strengthens and speeds the neural pathway", "It needs warming up", "It weakens with use"], "correct": 1, "explanation": "Actively pulling information out of memory reinforces it — the testing effect."}, {"question": "Which research underlies sleep consolidation?", "options": ["Cognitive load theory", "Parkinson's Law", "Hippocampal replay and sleep-dependent consolidation", "The expertise reversal effect"], "correct": 2, "explanation": "The hippocampus reactivates daytime sequences during sleep, transferring them to cortex."}] },
      { id: '4.3', vimeoId: '1196631238', title: 'Deadline system',                                                 instructor: 'Michelangelo Salamone', duration: null, theory: "<p><strong>The principle.</strong> The deadline system structures the entire path to a performance, starting from three diagnostic questions: how much time is there from today until the exam, concert, or competition? What is the real difficulty of the piece? And what is my level of expertise? The answers define the basis for a realistic plan. A non-negotiable rule anchors it: the repertoire must be ready <em>at least four weeks before</em> the performance.</p><p>The system has three phases — initial planning and learning, optimization, and preparation — but they are <em>not</em> split evenly. Suppose there are twelve weeks to the concert. Subtract the four-week pre-performance buffer, leaving eight weeks. The intuitive move is 50/50: four weeks learning, four weeks optimizing. But that is wrong. The initial analysis-and-learning phase must be completed <em>as soon as possible</em> — because that is the phase governed by the principles that limit risk and bad habits (recall: do it well and do it now, before overlearning sets in). Finishing learning quickly leaves more space for optimization, which is where the real refinement happens.</p><p>The final four weeks before performance are reserved for consolidation and <em>testing</em> of memorization — because memorization itself is not enough. To face a stage or a competition, you must test it under realistic conditions, not merely possess it. The deadline system thus front-loads safe learning, maximizes optimization time, and protects a dedicated window for testing.</p><p><strong>What the science says.</strong> This applies the <strong>goal-setting and deadline research</strong> from Module 1 (Locke and Latham; Parkinson's Law) to a full preparation timeline, and combines it with the <strong>overlearning principle</strong> — front-loading correct learning before flawed patterns automate. The insistence on a four-week testing buffer reflects <strong>retrieval and transfer-of-training</strong> research: skills must be tested under conditions resembling performance to transfer reliably, not merely rehearsed to the point of apparent mastery.</p><p><strong>— Experiential Exercise —</strong></p><p>Take a real upcoming performance date and build the deadline system backward. Answer the three diagnostic questions (time available, piece difficulty, your expertise). Reserve the final four weeks for consolidation and testing — non-negotiable. From the remaining time, deliberately compress the learning phase to finish as early as possible, allocating the surplus to optimization rather than splitting evenly. Write the dated phase boundaries down. The exercise turns \"I have twelve weeks\" into a front-loaded, test-protected plan rather than an even, drift-prone split.</p>", attachments: [], quiz: [{"question": "What three questions begin the deadline system?", "options": ["Tempo, dynamics, fingering", "Time available, the piece's difficulty, and your level of expertise", "Key, form, style", "Venue, jury, audience"], "correct": 1, "explanation": "These define the realistic basis for the preparation path."}, {"question": "How far before the performance must the repertoire be ready?", "options": ["One week", "At least four weeks", "Two weeks", "The day before"], "correct": 1, "explanation": "A four-week buffer is reserved for consolidation and testing."}, {"question": "Why is a 50/50 learning/optimization split wrong?", "options": ["Optimization is unnecessary", "Learning must finish as early as possible to limit bad habits and leave more time for optimization", "Learning takes longer", "They should be equal"], "correct": 1, "explanation": "Front-loading correct learning prevents overlearning errors and maximizes refinement time."}, {"question": "What are the final four weeks reserved for?", "options": ["Learning new repertoire", "Consolidation and testing of memorization", "Resting", "Sight-reading"], "correct": 1, "explanation": "Memorization must be tested under realistic conditions, not merely possessed."}, {"question": "Why is memorization alone not enough?", "options": ["It fades too fast", "It must be tested under performance-like conditions to transfer reliably", "It is too slow", "It needs the score"], "correct": 1, "explanation": "Testing under realistic stress is what makes memory reliable on stage."}] },
      { id: '4.4', vimeoId: '1196631144', title: 'Types of pianistic memory',                                       instructor: 'Michelangelo Salamone', duration: null, theory: "<p><strong>The principle.</strong> A pianist can exploit <em>four types of memory</em>, and using all four together exponentially reduces — though never fully cancels — memory slips on stage. (It reduces rather than cancels because memory slips have two foundations, methodological and psychological: even perfect methodology can be disrupted by psychological interference.)</p><p><em>Kinesthetic memory</em> (also called digital or muscle memory) lets us play through automatisms learned by repetition and overlearned sequences — the foundation of piano learning, since repetition is the mother of studying. Its weakness: on stage it is the most vulnerable to performance anxiety. <em>Auditory memory</em> lets us imagine the piece through its musical flow, predicting what comes next and giving feedback on wrong notes. Its limitation: it lacks concrete reference points, so identical phrases in different keys (common in Mozart or Beethoven) can cause confusion. <em>Visual memory</em> recalls through visual association, split into <em>photographic memory</em> (mental pictures of the score) and <em>keyboard memory</em> (a mental \"video\" of the hands and gestures on the keyboard). <em>Analytical memory</em> recalls through deep knowledge and detailed analysis of the score — key, phrases and sub-phrases, voices, harmonic and melodic development, pauses, articulation, fingering, everything on the page.</p><p>The strategic point is redundancy. Each memory type has a failure mode, but they fail differently — so building all four creates overlapping safety nets. If anxiety disrupts kinesthetic memory, analytical and auditory memory can hold; if auditory memory confuses two similar passages, analytical memory disambiguates by key and structure.</p><p><strong>What the science says.</strong> The four-memory framework is well established in piano pedagogy, and the lesson attributes the primacy of <strong>analytical memory</strong> to legendary pianists and pedagogues including <strong>Sandor, Leimer, and Gieseking</strong>, who argued that intelligent memorization rests on deep knowledge of the music. The redundancy principle aligns with <strong>multiple-encoding</strong> research in memory science: information encoded through several independent channels is more robustly retrievable, because no single point of failure can erase it. Kinesthetic memory's vulnerability to anxiety reflects the documented disruption of automated motor sequences under pressure (Beilock's choking research).</p><p><strong>— Experiential Exercise —</strong></p><p>Take a piece you have memorized mainly through the fingers (kinesthetic) and deliberately build the other three layers. For <em>analytical</em>: away from the piano, write out its key areas, phrase structure, harmonic turns, and any near-identical passages that differ by key. For <em>auditory</em>: sing or audiate the musical flow and locate the spots where similar phrases could be confused. For <em>visual</em>: form a photographic image of a difficult page and a \"keyboard video\" of one hard passage's gestures. The exercise converts a single-channel memory into a four-channel one, so that no single failure mode can erase the passage on stage.</p>", attachments: [], quiz: [{"question": "What are the four types of pianistic memory?", "options": ["Short, long, working, sensory", "Kinesthetic, auditory, visual, analytical", "Photographic, motor, harmonic, rhythmic", "Encoding, storage, retrieval, recall"], "correct": 1, "explanation": "Using all four together exponentially reduces memory slips."}, {"question": "Why does using all four reduce but not cancel memory slips?", "options": ["Four is not enough", "Slips have a psychological foundation too, which methodology alone cannot remove", "Memory always fails", "It does cancel them"], "correct": 1, "explanation": "Even perfect methodology can be disrupted by psychological interference."}, {"question": "What is the main weakness of kinesthetic memory?", "options": ["It is the slowest to build", "It is the most vulnerable to performance anxiety on stage", "It ignores the music", "It needs the score"], "correct": 1, "explanation": "Automated motor memory can break down under performance pressure."}, {"question": "What distinguishes photographic from keyboard memory?", "options": ["One is faster", "Photographic pictures the score; keyboard videos the hands and gestures", "One is auditory", "They are identical"], "correct": 1, "explanation": "Both are visual, but photographic captures the page and keyboard captures the playing."}, {"question": "Which pianists are cited on the value of analytical memory?", "options": ["Richter and Horowitz", "Sandor, Leimer, and Gieseking", "Argerich and Gelber", "Liszt and Chopin"], "correct": 1, "explanation": "They argued intelligent memorization rests on deep knowledge of the music."}] },
      { id: '4.5', vimeoId: '1196631187', title: 'Testing memory before stage',                                     instructor: 'Michelangelo Salamone', duration: null, theory: "<p><strong>The principle.</strong> With four weeks left, the question that besieges every pianist is: have I done everything properly? To step on stage with confidence, the lesson offers a testing protocol in escalating stages, designed to cut anxiety by exposing exactly what is and is not solid.</p><p>The <em>memory test</em> has three phases, done every day: perform with the score on the stand; perform without the score; and mentally perform while reading the score. Across these you underline what is perfectly memorized and what needs better consolidation — then work directly on what is not solid. Next comes the <em>visualization test</em>: where the memory test varied score and piano, the visualization test removes both — you perform without score and without piano, purely in the mind. This builds on <em>motor imagery</em> (MI): by imagining the piano and yourself playing, you project the real performance for your brain and focus on every detail. Finally, the <em>recording test</em>: record yourself recreating the atmosphere of a concert. This triggers the very emotions that arise in real performance, letting you train control of the stress and emotional reactions that surface during anxiety-inducing events. Put it on the calendar three or four times across the final four weeks.</p><p>The unifying idea is that practicing in your own room is risk-free and therefore not representative. Confidence comes from progressively removing supports (score, then instrument) and progressively adding pressure (recording, simulated concert) — training retrieval and emotional control like a muscle, so the stage holds no surprises.</p><p><strong>What the science says.</strong> The three-phase memory test is structured <strong>retrieval practice</strong> under varied support conditions. The visualization test rests on <strong>motor imagery</strong> (Jeannerod) — mentally rehearsing performance activates overlapping motor representations. The recording test applies <strong>simulation and stress-exposure training</strong>: deliberately recreating performance pressure builds tolerance, consistent with research on how rehearsing under representative anxiety conditions improves transfer to real performance and reduces choking (Beilock). This is the methodological counterpart to the psychology module's work on performance anxiety.</p><p><strong>— Experiential Exercise —</strong></p><p>In the four weeks before a performance, run the three escalating tests. Daily: the three-phase memory test (with score, without score, mental-with-score), underlining and fixing what is not solid. Then add the visualization test — perform the piece with no score and no piano, in pure mental rehearsal, attending to every detail. Finally, schedule three or four recording tests: dress and set up as if for a concert, record, and let the real performance emotions arise so you can practice controlling them. The exercise systematically removes supports and adds pressure, converting private security into stage-ready confidence.</p>", attachments: [], quiz: [{"question": "What are the three phases of the memory test?", "options": ["Slow, moderate, fast", "With the score, without the score, and mental performance while reading the score", "With piano, without piano, recorded", "Encode, consolidate, retrieve"], "correct": 1, "explanation": "Done daily, they reveal what is solid and what needs consolidation."}, {"question": "How does the visualization test differ from the memory test?", "options": ["It adds an audience", "It removes both the score and the piano — pure mental performance", "It uses a recording", "It is done with the score"], "correct": 1, "explanation": "The visualization test relies entirely on motor imagery, with no external support."}, {"question": "What is the purpose of the recording test?", "options": ["To check wrong notes", "To trigger real-performance emotions and train control of stress", "To share online", "To measure tempo"], "correct": 1, "explanation": "Recreating concert pressure builds tolerance to performance anxiety."}, {"question": "Why is practicing only in your room insufficient?", "options": ["It is too short", "It is risk-free and not representative of performance conditions", "The piano is different", "There is no audience to applaud"], "correct": 1, "explanation": "Confidence requires removing supports and adding realistic pressure."}, {"question": "Which principle underlies the visualization test?", "options": ["Chunking", "Motor imagery — mentally rehearsing activates motor representations", "Cognitive load", "The endowed progress effect"], "correct": 1, "explanation": "Imagining the performance projects it for the brain, rehearsing without the instrument."}] },
      { id: '4.6', vimeoId: '1196631136', title: 'Homeostasis and the principle of making everything harder',       instructor: 'Michelangelo Salamone', duration: null, theory: "<p><strong>The principle.</strong> The body is programmed to stay in a state of comfort — it does not want discomfort. When we step out of the comfort zone, the body is stressed and tries to adapt to the new inputs in order to overcome the difficulty. This is <em>homeostasis</em>: the tendency to return to a stable, comfortable baseline. The training implication is counterintuitive — to prepare for performance, we deliberately <em>make everything harder</em>, forcing the body to adapt upward to a new, more demanding baseline.</p><p>The reasoning is practical. A pianist constantly faces the challenge of quickly adapting to new instruments and acoustic environments — a different piano, an unfamiliar hall. If your practice is always maximally comfortable, you have no reserve of adaptability when conditions change on stage. So, building on <em>practice flexibility</em>, you deliberately step out of homeostasis in your own practice room: play with darker lights, play without adjusting the stool, introduce background noises. Each artificial difficulty forces adaptation, so that the real performance — even on a strange instrument in a strange room — falls <em>within</em> the range your body has already learned to handle.</p><p>The deeper idea is building adaptability as a skill in itself. By over-stressing practice conditions, you ensure that the unpredictable variations of a real performance are no longer destabilizing — they are easier than what you have already trained against.</p><p><strong>What the science says.</strong> This applies <strong>homeostasis</strong> and the broader principle of <strong>adaptation to stressors</strong>: systems exposed to a controlled stressor adapt to a higher baseline (the general logic of hormesis and training overload in physiology). It also reflects <strong>desirable difficulties</strong> (Bjork) and <strong>variable practice</strong>: deliberately harder, more variable practice conditions build more robust, transferable skill. Practicing under degraded or unpredictable conditions is a form of <strong>stress inoculation</strong>, raising the threshold at which real-performance variability becomes disruptive.</p><p><strong>— Experiential Exercise —</strong></p><p>Take a piece that feels secure in your normal practice setup and deliberately degrade the conditions. Across several sessions, introduce one artificial difficulty at a time: dim or change the lighting, refuse to adjust the stool to your preferred height, add background noise, or play cold without warming up. Note where your security breaks down under each stressor and work until the piece holds regardless. The exercise builds adaptability as a trained skill, so that the unfamiliar instrument and hall of a real performance feel easier than your own deliberately harsh practice.</p>", attachments: [], quiz: [{"question": "What is homeostasis, as used here?", "options": ["A memory technique", "The body's tendency to return to a comfortable, stable baseline", "A tempo marking", "A type of scale"], "correct": 1, "explanation": "The body resists discomfort and adapts when pushed out of its comfort zone."}, {"question": "What is the counterintuitive training implication?", "options": ["Always practice comfortably", "Deliberately make practice harder to force adaptation upward", "Avoid all stress", "Practice less"], "correct": 1, "explanation": "Controlled difficulty raises the baseline the body can handle."}, {"question": "Why is adaptability important for pianists specifically?", "options": ["They travel often", "They must quickly adapt to new instruments and acoustic environments", "They perform from memory", "They read fast"], "correct": 1, "explanation": "A different piano or hall demands adaptability that comfortable practice never builds."}, {"question": "Give an example of making everything harder.", "options": ["Playing faster", "Playing with darker lights, without adjusting the stool, or with background noise", "Playing louder", "Playing more often"], "correct": 1, "explanation": "Artificial difficulties force adaptation so real conditions feel easier."}, {"question": "Which learning principle supports this approach?", "options": ["The endowed progress effect", "Desirable difficulties / stress inoculation — harder practice builds transferable robustness", "Chunking", "Cognitive load reduction"], "correct": 1, "explanation": "Controlled stressors raise the threshold at which real variability becomes disruptive."}] }
    ]
  },

/* ── Persistence ─────────────────────────────────────────── */
const PROG_DEFAULTS = { currentTime: 0, duration: 0, percentWatched: 0, theoryRead: false, attachmentsViewed: false, quizPassed: false, quizScore: 0 };

function _applyProgDefaults(p) {
  Object.keys(p).forEach(id => { p[id] = { ...PROG_DEFAULTS, ...p[id] }; });
}

function loadProg() {
  try { prog = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; } catch { prog = {}; }
  _applyProgDefaults(prog);
}

/* Server load — returns parsed progress object or null on failure/timeout */
async function _loadProgServer() {
  const ctrl  = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 3000);
  try {
    const resp = await fetch(SERVER_PROG_URL, { credentials: 'same-origin', signal: ctrl.signal, headers: { 'X-WP-Nonce': window.PM_NONCE || '' } });
    clearTimeout(timer);
    if (!resp.ok) return null;
    const data = await resp.json();
    let p = data && data.progress;
    if (typeof p === 'string') { try { p = JSON.parse(p); } catch { return null; } }
    if (!p || Array.isArray(p) || typeof p !== 'object' || Object.keys(p).length === 0) return null;
    return p;
  } catch {
    clearTimeout(timer);
    return null;
  }
}

/* Guard: no POST may fire until the initial GET has resolved */
let _progressLoaded = false;

/* Server save — fire-and-forget, no retry needed (localStorage already saved) */
let _serverSaveTimer = null;
async function _serverSaveNow() {
  // Never POST before the initial GET completes; reject arrays, non-objects, and empty maps
  if (!_progressLoaded || !prog || Array.isArray(prog) || typeof prog !== 'object' || Object.keys(prog).length === 0) return;
  try {
    await fetch(SERVER_PROG_URL, {
      method: 'POST',
      credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json', 'X-WP-Nonce': window.PM_NONCE || '' },
      body: JSON.stringify({ progress: prog })
    });
  } catch {} // silent — localStorage is the fallback
}

function saveProg() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(prog)); } catch {}
  clearTimeout(_serverSaveTimer);
  _serverSaveTimer = setTimeout(_serverSaveNow, SERVER_SAVE_DELAY);
}

function getProg(id) {
  return prog[id] ? { ...PROG_DEFAULTS, ...prog[id] } : { ...PROG_DEFAULTS };
}

/* ── Unlock logic ─────────────────────────────────────────── */
function isFullyComplete(id) {
  if (isPlaceholder(id)) return false;
  const p      = getProg(id);
  const lesson = getLessonData(id);
  return (
    p.percentWatched >= UNLOCK_PCT &&
    p.theoryRead === true &&
    (lesson.attachments.length === 0 || p.attachmentsViewed === true) &&
    p.quizPassed === true
  );
}
function isUnlocked(id) {
  if (isPlaceholder(id)) return false;
  const idx = ALL_LESSONS.indexOf(id);
  if (idx <= 0) return true;
  return isFullyComplete(ALL_LESSONS[idx - 1]);
}
function nextLesson(id) {
  const idx = ALL_LESSONS.indexOf(id);
  return (idx >= 0 && idx < ALL_LESSONS.length - 1) ? ALL_LESSONS[idx + 1] : null;
}
function prevLesson(id) {
  const idx = ALL_LESSONS.indexOf(id);
  return idx > 0 ? ALL_LESSONS[idx - 1] : null;
}
function completedCount() {
  return ALL_LESSONS.filter(id => !isPlaceholder(id) && getProg(id).percentWatched >= UNLOCK_PCT).length;
}
function totalReal() {
  return ALL_LESSONS.filter(id => !isPlaceholder(id)).length;
}
function overallPct() {
  const real = totalReal();
  return real > 0 ? Math.round((completedCount() / real) * 100) : 0;
}
function getOverallCompletion() {
  const real = ALL_LESSONS.filter(id => !isPlaceholder(id));
  if (real.length === 0) return 0;
  return Math.round((real.filter(id => isFullyComplete(id)).length / real.length) * 100);
}

/* ═══════════════════════════════════════════════════════════════
   PLAYER
═══════════════════════════════════════════════════════════════ */
function renderPlayer(id) {
  const lesson = getLessonData(id);
  if (!lesson || isPlaceholder(id)) return '';

  if (VIDEO_PROVIDER === 'vimeo') {
    return `<iframe
      src="https://player.vimeo.com/video/${lesson.vimeoId}?title=0&byline=0&portrait=0&badge=0&autopause=0&dnt=1&player_id=0&app_id=58479"
      frameborder="0"
      allow="autoplay; fullscreen; picture-in-picture; clipboard-write; encrypted-media; web-share"
      referrerpolicy="strict-origin-when-cross-origin"
      allowfullscreen
      style="position:absolute;top:0;left:0;width:100%;height:100%;"></iframe>`;
  }
  return '';
}

function loadLesson(id) {
  const lesson = getLessonData(id);
  if (!lesson) return;

  activeId      = id;
  playingId     = id;
  currentScreen = 'video';
  const pw = document.querySelector('.player-wrap');
  if (pw) pw.style.display = '';

  document.getElementById('playerRatio').innerHTML = renderPlayer(id);

  if (VIDEO_PROVIDER === 'vimeo') {
    _initVimeo(id);
  }

  _updateLessonInfo(id);
  renderLessonExperience(id);
  renderModuleList();
  updateOverallProgress();

  document.getElementById('mainArea').scrollTo({ top: 0, behavior: 'smooth' });
  closeSidebar();
}

function _initVimeo(id) {
  const iframe = document.querySelector('#playerRatio iframe');
  if (!iframe) return;

  if (window._vimeoPlayer) {
    try { window._vimeoPlayer.destroy(); } catch {}
    window._vimeoPlayer = null;
  }

  window._vimeoPlayer = new Vimeo.Player(iframe);
  const player = window._vimeoPlayer;

  const startT = Math.floor(getProg(id).currentTime || 0);
  if (startT > 5) {
    player.ready().then(() => player.setCurrentTime(startT)).catch(() => {});
  }

  player.on('timeupdate', data => onTimeUpdate(data.seconds, data.duration));
  player.on('ended', () => onEnded());

  player.getDuration().then(dur => {
    const lesson = getLessonData(id);
    if (lesson) {
      lesson.duration = dur;
      renderModuleList();
    }
  }).catch(() => {});
}

/* ── Screen-based navigation ─────────────────────────────── */
function _screenList(id) {
  const lesson = getLessonData(id);
  const screens = ['video', 'theory'];
  if (lesson && lesson.attachments && lesson.attachments.length > 0) screens.push('attachments');
  screens.push('quiz');
  return screens;
}
function _prevScreen(id) {
  const s = _screenList(id); const i = s.indexOf(currentScreen);
  return i > 0 ? s[i - 1] : null;
}
function _nextScreen(id) {
  const s = _screenList(id); const i = s.indexOf(currentScreen);
  return (i >= 0 && i < s.length - 1) ? s[i + 1] : null;
}
function goToScreen(screen, id) {
  const prev = currentScreen;
  currentScreen = screen;
  const playerWrap = document.querySelector('.player-wrap');

  if (prev === 'video' && screen !== 'video') {
    if (window._vimeoPlayer) {
      try { window._vimeoPlayer.destroy(); } catch {}
      window._vimeoPlayer = null;
    }
    document.getElementById('playerRatio').innerHTML = '';
    if (playerWrap) playerWrap.style.display = 'none';
    playingId = null;
  }
  if (screen === 'video' && prev !== 'video') {
    if (playerWrap) playerWrap.style.display = '';
    document.getElementById('playerRatio').innerHTML = renderPlayer(id);
    if (VIDEO_PROVIDER === 'vimeo') _initVimeo(id);
    playingId = id;
  }
  renderLessonExperience(id);
  document.getElementById('mainArea').scrollTo({ top: 0, behavior: 'smooth' });
}

function showLocked(id) {
  activeId  = id;
  playingId = null;

  const prev = prevLesson(id);
  const prevLesson_ = prev ? getLessonData(prev) : null;
  const msg = prevLesson_
    ? `Complete "${prevLesson_.title}" to unlock this lesson.`
    : 'Complete the previous lesson to unlock this one.';

  document.getElementById('playerRatio').innerHTML = `
    <div class="player-locked">
      <div class="pl-icon">🔒</div>
      <p class="pl-title">Lesson locked</p>
      <p class="pl-sub">${msg}</p>
    </div>`;

  const nb = document.getElementById('nextBtn');
  if (nb) { nb.style.display = 'none'; nb.onclick = null; }

  renderModuleList();
  closeSidebar();
}

function showComingSoon(id) {
  activeId  = id;
  playingId = null;

  document.getElementById('playerRatio').innerHTML = `
    <div class="player-coming-soon">
      <p>This lesson is not yet available. Check back soon.</p>
    </div>`;

  const lesson = getLessonData(id);
  if (lesson) {
    document.getElementById('lessonTitle').textContent = lesson.title;
    document.getElementById('lessonDesc').textContent  = lesson._mod.description || '';
    document.getElementById('authorName').textContent  = lesson.instructor;
    document.getElementById('authorAvatar').textContent =
      lesson.instructor.split(' ').map(w => w[0]).join('').slice(0, 2).toUpperCase();
    document.getElementById('nextBtn').style.display = 'none';
  }

  renderModuleList();
  closeSidebar();
}

function handleLessonClick(id) {
  if (isPlaceholder(id)) {
    showComingSoon(id);
  } else if (!isUnlocked(id)) {
    showLocked(id);
  } else {
    loadLesson(id);
  }
}

/* ═══════════════════════════════════════════════════════════════
   LEFT COLUMN UPDATES
═══════════════════════════════════════════════════════════════ */
function _updateLessonInfo(id) {
  const lesson = getLessonData(id);
  if (!lesson) return;

  document.getElementById('lessonTitle').textContent = lesson.title;
  document.getElementById('lessonDesc').textContent  = lesson._mod.description || '';
  document.getElementById('authorName').textContent  = lesson.instructor;

  document.getElementById('authorAvatar').textContent =
    lesson.instructor.split(' ').map(w => w[0]).join('').slice(0, 2).toUpperCase();

  const next = nextLesson(id);
  const realLessons = ALL_LESSONS.filter(lid => !isPlaceholder(lid));
  const allDone = realLessons.every(lid => getProg(lid).percentWatched >= UNLOCK_PCT);
  document.getElementById('completeBanner').classList.toggle('is-visible', !next && allDone);
}

/* State-driven forward navigation button */
function _showNavHint(msg) {
  const hint = document.getElementById('navHint');
  if (!hint) return;
  hint.textContent = msg;
  hint.classList.add('is-visible');
  clearTimeout(hint._timer);
  hint._timer = setTimeout(() => hint.classList.remove('is-visible'), 4000);
}

function _highlightMarkRead() {
  const btn = document.getElementById('btnMarkRead');
  if (!btn) return;
  btn.scrollIntoView({ behavior: 'smooth', block: 'center' });
  btn.classList.remove('btn-mark-highlight');
  void btn.offsetWidth; // force reflow to restart animation
  btn.classList.add('btn-mark-highlight');
  setTimeout(() => btn.classList.remove('btn-mark-highlight'), 2500);
}

function _updateNavBtn(id) {
  const btn = document.getElementById('nextBtn');
  if (!btn) return;
  if (!id || isPlaceholder(id)) { btn.style.display = 'none'; btn.onclick = null; return; }

  const lesson = getLessonData(id);
  const p      = getProg(id);
  const nextId = nextLesson(id);
  let label = null, onclick = null;

  if (currentScreen === 'video') {
    label   = 'Continue to Theory';
    onclick = () => {
      if (getProg(id).percentWatched >= UNLOCK_PCT) {
        goToScreen('theory', id);
      } else {
        _showNavHint('Watch at least 80% of the video to continue.');
      }
    };

  } else if (currentScreen === 'theory') {
    const ns = _nextScreen(id);
    label   = ns === 'attachments' ? 'Continue to Attachments' : 'Continue to Quiz';
    onclick = () => {
      if (getProg(id).theoryRead) {
        goToScreen(ns, id);
      } else {
        _showNavHint('Read the theory and mark it as read to continue.');
        _highlightMarkRead();
      }
    };

  } else if (currentScreen === 'attachments') {
    label   = 'Continue to Quiz';
    onclick = () => {
      if (getProg(id).attachmentsViewed) {
        goToScreen('quiz', id);
      } else {
        _showNavHint('Mark the attachments as viewed to continue.');
      }
    };

  } else if (currentScreen === 'quiz') {
    const hasQuiz = lesson.quiz && lesson.quiz.length > 0;
    if (p.quizPassed) {
      if (nextId) {
        label   = 'Next Lesson';
        onclick = () => handleLessonClick(nextId);
      }
    } else if (!hasQuiz) {
      label   = 'Complete Lesson';
      onclick = () => {
        prog[id] = { ...getProg(id), quizPassed: true, quizScore: 0 };
        saveProg(); renderModuleList(); updateOverallProgress();
        renderQuizScreen(id); renderStepIndicator(id); renderCoachingMain(); renderCoachingSidebar();
        _updateNavBtn(id);
      };
    } else {
      label   = 'Next Lesson';
      onclick = () => _showNavHint('Complete the quiz to continue.');
    }
  }

  const arrow = `<svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><line x1="2" y1="6" x2="10" y2="6"/><polyline points="7,3 10,6 7,9"/></svg>`;
  if (label) {
    btn.style.display = '';
    btn.innerHTML     = `${label} ${arrow}`;
    btn.onclick       = onclick;
  } else {
    btn.style.display = 'none';
    btn.onclick       = null;
  }
}

/* ═══════════════════════════════════════════════════════════════
   SIDEBAR: MODULE LIST
═══════════════════════════════════════════════════════════════ */
function renderModuleList() {
  const container = document.getElementById('moduleList');
  container.innerHTML = '';

  modules.forEach(mod => {
    const totalSec = mod.lessons.reduce((s, l) => s + (l.duration || 0), 0);
    const h = Math.floor(totalSec / 3600);
    const m = Math.floor((totalSec % 3600) / 60);
    const durLabel = totalSec > 0 ? (h > 0 ? `${h}h ${m}m` : `${m}m`) : '';

    const lessonsHtml = mod.lessons.map(l => _makeLessonRow(l)).join('');

    const card = document.createElement('div');
    card.className = 'mod-card';
    card.id = 'mod-' + mod.id;
    card.innerHTML = `
      <div class="mod-card-hdr">
        <div class="mod-card-top">
          <span class="mod-name">${mod.title}</span>
          ${durLabel ? `<span class="mod-dur">${durLabel}</span>` : ''}
        </div>
        <div class="mod-tags">
          <span class="mod-tag" style="background:${mod.tag1.bg};color:${mod.tag1.color}">${mod.tag1.label}</span>
          <span class="mod-tag" style="background:${mod.tag2.bg};color:${mod.tag2.color}">${mod.tag2.label}</span>
        </div>
      </div>
      <div class="mod-lessons">${lessonsHtml}</div>`;

    /* Attach click to every lesson row — handleLessonClick routes correctly */
    mod.lessons.forEach(l => {
      const row = card.querySelector('#lr-' + l.id.replace('.', '_'));
      if (row) {
        row.addEventListener('click', () => handleLessonClick(l.id));
        row.addEventListener('keydown', e => { if (e.key === 'Enter') handleLessonClick(l.id); });
      }
    });

    container.appendChild(card);
  });
}

function _makeLessonRow(lesson) {
  const id       = lesson.id;
  const p        = getProg(id);
  const placeholder = isPlaceholder(id);
  const unlocked = !placeholder && isUnlocked(id);
  const done     = !placeholder && p.percentWatched >= UNLOCK_PCT;
  const isActive = activeId === id;
  const pct      = p.percentWatched || 0;

  const dur    = lesson.duration;
  const durStr = dur ? `${Math.floor(dur / 60)}:${String(Math.floor(dur % 60)).padStart(2, '0')}` : '--:--';

  let cls = 'lr';
  if (isActive) cls += ' lr--active';
  if (placeholder) {
    cls += ' lr--coming-soon';
  } else if (!unlocked) {
    cls += ' lr--locked';
  }
  if (done) cls += ' lr--done';

  const safeId   = id.replace('.', '_');
  const tabindex = (unlocked || placeholder) ? '0' : '-1';
  const role     = (unlocked || placeholder) ? `role="button" aria-label="Play ${lesson.title}"` : 'aria-disabled="true"';

  return `
    <div class="${cls}" id="lr-${safeId}" tabindex="${tabindex}" ${role}>
      <div class="lr-icon">${_makeLessonIcon(unlocked, done, isActive, pct, safeId, placeholder)}</div>
      <div class="lr-info">
        <span class="lr-title">${lesson.title}</span>
        <span class="lr-dur">${durStr}</span>
      </div>
    </div>`;
}

function _makeLessonIcon(unlocked, done, isActive, pct, safeId, placeholder) {
  if (!unlocked || placeholder) {
    return `<svg width="32" height="32" viewBox="0 0 32 32" aria-hidden="true">
      <circle cx="16" cy="16" r="14" fill="white" stroke="#D1D5DB" stroke-width="2"/>
      <rect x="11" y="15" width="10" height="8" rx="2" fill="#9CA3AF"/>
      <path d="M13 15v-3a3 3 0 0 1 6 0v3" stroke="#9CA3AF" stroke-width="2" fill="none" stroke-linecap="round"/>
    </svg>`;
  }
  if (done) {
    return `<svg width="32" height="32" viewBox="0 0 32 32" aria-hidden="true">
      <circle cx="16" cy="16" r="16" fill="#1D9E75"/>
      <polyline points="10,16 14,20.5 22,12" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>`;
  }
  if (isActive) {
    const C    = 2 * Math.PI * 14;
    const dash = ((pct / 100) * C).toFixed(2);
    return `<svg width="32" height="32" viewBox="0 0 32 32" aria-hidden="true">
      <circle cx="16" cy="16" r="14" fill="none" stroke="#E5E7EB" stroke-width="2.5"/>
      <circle cx="16" cy="16" r="14" fill="none" stroke="#D4A574" stroke-width="2.5"
        stroke-dasharray="${dash} ${C.toFixed(2)}"
        transform="rotate(-90 16 16)" stroke-linecap="round" id="arc-${safeId}"/>
      <circle cx="16" cy="16" r="10" fill="white" stroke="#1B3A6B" stroke-width="2"/>
      <rect x="12.5" y="12" width="2.5" height="8" rx="1" fill="#1B3A6B"/>
      <rect x="17"   y="12" width="2.5" height="8" rx="1" fill="#1B3A6B"/>
    </svg>`;
  }
  return `<svg width="32" height="32" viewBox="0 0 32 32" aria-hidden="true">
    <circle cx="16" cy="16" r="14" fill="white" stroke="#1B3A6B" stroke-width="2"/>
    <polygon points="13.5,11.5 22.5,16 13.5,20.5" fill="#1B3A6B"/>
  </svg>`;
}

/* ═══════════════════════════════════════════════════════════════
   PROGRESS TRACKING
═══════════════════════════════════════════════════════════════ */
function onTimeUpdate(t, dur) {
  if (!playingId) return;
  const pct      = dur > 0 ? (t / dur) * 100 : 0;
  const existing = getProg(playingId);

  prog[playingId] = {
    ...existing,
    currentTime:    t,
    duration:       dur,
    percentWatched: Math.max(pct, existing.percentWatched)
  };

  /* Update active-lesson arc in-place */
  const safeId = playingId.replace('.', '_');
  const arcEl  = document.getElementById('arc-' + safeId);
  if (arcEl) {
    const C = 2 * Math.PI * 14;
    arcEl.setAttribute('stroke-dasharray', `${((pct / 100) * C).toFixed(2)} ${C.toFixed(2)}`);
  }

  updateOverallProgress();
  if (pct >= UNLOCK_PCT) _onThresholdReached(playingId);
}

function onEnded() {
  if (!playingId) return;
  const p = getProg(playingId);
  prog[playingId] = { ...p, percentWatched: 100 };
  saveProg();
  renderModuleList();
  updateOverallProgress();
  if (activeId) _updateLessonInfo(activeId);
  if (activeId) renderLessonExperience(activeId);
}

function _onThresholdReached(id) {
  renderModuleList();
  updateOverallProgress();
  if (activeId === id) renderLessonExperience(id);
}

function updateOverallProgress() {
  const done = completedCount();
  const real = totalReal();
  const pct  = overallPct();

  document.getElementById('progressText').textContent = `${done} of ${real} lessons completed`;

  const C    = 2 * Math.PI * 18;
  const ring = document.getElementById('overallRingFill');
  if (ring) {
    ring.setAttribute('stroke-dasharray', `${((pct / 100) * C).toFixed(2)} ${C.toFixed(2)}`);
    ring.setAttribute('stroke', pct > 0 ? '#D4A574' : '#E5E7EB');
  }

  document.getElementById('hdrFill').style.width = pct + '%';
  document.getElementById('hdrPct').textContent  = pct + '%';
}

/* ═══════════════════════════════════════════════════════════════
   LESSON EXPERIENCE RENDERING
═══════════════════════════════════════════════════════════════ */

/* Quiz UI state — session only, not persisted */
let quizState = { lessonId: null, questions: [], qIdx: 0, selected: null, revealed: false, score: 0, done: false };

function _shuffleArr(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* Orchestrator — routes to current screen */
function renderLessonExperience(id) {
  if (!id || isPlaceholder(id)) {
    ['stepIndicator','theorySection','attachmentsSection','quizSection','coachingMain'].forEach(
      eid => { const e = document.getElementById(eid); if (e) e.innerHTML = ''; }
    );
    renderCoachingSidebar();
    return;
  }
  renderStepIndicator(id);
  ['theorySection','attachmentsSection','quizSection'].forEach(
    eid => { const e = document.getElementById(eid); if (e) e.innerHTML = ''; }
  );
  if      (currentScreen === 'theory')      renderTheoryScreen(id);
  else if (currentScreen === 'attachments') renderAttachmentsScreen(id);
  else if (currentScreen === 'quiz')        renderQuizScreen(id);
  renderCoachingMain();
  renderCoachingSidebar();
  _updateNavBtn(id);
}

/* ── Step Indicator ─────────────────────────────────────── */
function _buildSteps(id) {
  const lesson = getLessonData(id);
  const p = getProg(id);
  const hasAtt = lesson.attachments && lesson.attachments.length > 0;
  const vDone  = p.percentWatched >= UNLOCK_PCT;
  const tDone  = p.theoryRead === true;
  const aDone  = !hasAtt || p.attachmentsViewed === true;
  const qDone  = p.quizPassed === true;
  const steps  = [
    { key: 'video',  label: 'VIDEO',  done: vDone, active: currentScreen === 'video',  nav: true },
    { key: 'theory', label: 'THEORY', done: tDone, active: currentScreen === 'theory', nav: vDone },
  ];
  if (hasAtt) steps.push({ key: 'attachments', label: 'ATTACHMENTS', done: aDone, active: currentScreen === 'attachments', nav: tDone });
  steps.push({ key: 'quiz', label: 'QUIZ', done: qDone, active: currentScreen === 'quiz', nav: tDone && aDone });
  return steps;
}

function renderStepIndicator(id) {
  const el = document.getElementById('stepIndicator');
  if (!el) return;
  const steps    = _buildSteps(id);
  const total    = steps.length;
  const doneN    = steps.filter(s => s.done).length;
  const activeI  = steps.findIndex(s => s.active);
  const current  = activeI >= 0 ? activeI + 1 : (doneN === total ? total : 1);
  const mobilePct = Math.round((doneN / total) * 100);

  let h = '<div class="step-indicator">';
  steps.forEach((s, i) => {
    const dc      = s.done ? 'is-done' : (s.active ? 'is-active' : '');
    const lc      = s.done ? 'is-done' : (s.active ? 'is-active' : '');
    const navable = s.nav && !s.active;
    const dotCls  = `step-dot ${dc}${navable ? ' is-nav' : ''}`;
    h += `<div class="step-node"><div class="${dotCls}" data-screen="${s.key}">${s.done ? '✓' : i + 1}</div><span class="step-label ${lc}">${s.label}</span></div>`;
    if (i < total - 1) h += `<div class="step-connector${s.done ? ' is-done' : ''}"></div>`;
  });
  h += '</div>';
  h += `<div class="step-indicator-mobile"><span class="step-mobile-text">Step ${current} of ${total}</span><div class="step-mobile-bar"><div class="step-mobile-fill" style="width:${mobilePct}%"></div></div></div>`;
  el.innerHTML = h;

  el.querySelectorAll('.step-dot.is-nav').forEach(dot => {
    dot.addEventListener('click', () => goToScreen(dot.dataset.screen, id));
  });
}

/* ── Quiz Screen ────────────────────────────────────────── */
function renderQuizScreen(id) {
  const el = document.getElementById('quizSection');
  if (!el) return;
  const lesson = getLessonData(id);
  const p      = getProg(id);
  const prevS  = _prevScreen(id);
  const backLabel = prevS === 'attachments' ? '← Attachments' : '← Theory';

  if (quizState.lessonId !== id) {
    quizState = { lessonId: id, questions: _shuffleArr(lesson.quiz || []), qIdx: 0, selected: null, revealed: false, score: 0, done: false };
  }

  el.innerHTML = `<div class="screen-nav-row" style="margin-top:28px;padding-top:0;border-top:none">
      <button class="btn-screen-back" id="btnBackQuiz">${backLabel}</button>
    </div>
    <div class="ls-section" id="quizSectionInner"></div>`;

  document.getElementById('btnBackQuiz').addEventListener('click', () => goToScreen(prevS, id));
  const inner = document.getElementById('quizSectionInner');

  if (p.quizPassed) {
    inner.innerHTML = `<h2 class="ls-section-hdr">Knowledge Check</h2><p class="step-done-label">✓ Quiz passed — ${p.quizScore}/${lesson.quiz.length} correct</p>`;
    return;
  }
  if (!lesson.quiz || lesson.quiz.length === 0) {
    inner.innerHTML = `<h2 class="ls-section-hdr">Knowledge Check</h2><p class="quiz-subtitle">No quiz for this lesson.</p>`;
    return;
  }
  if (quizState.done) { _renderQuizResult(inner, id, lesson); return; }
  _renderQuizQ(inner, id, lesson);
}

function _renderQuizQ(container, id, lesson) {
  const qs = quizState.questions;
  const qi = quizState.qIdx;
  const q  = qs[qi];
  const total = qs.length;
  const pct   = Math.round((qi / total) * 100);
  let h = `<h2 class="ls-section-hdr">Knowledge Check</h2>
    <p class="quiz-subtitle">Answer at least ${Math.ceil(total * 0.7)} out of ${total} questions correctly to proceed.</p>
    <div class="quiz-progress-row"><span class="quiz-progress-label">Question ${qi + 1} of ${total}</span></div>
    <div class="quiz-progress-bar"><div class="quiz-progress-fill" style="width:${pct}%"></div></div>
    <p class="quiz-question-text">${q.question}</p>
    <div class="quiz-options" id="quizOpts">`;
  q.options.forEach((opt, oi) => {
    let cls = 'quiz-opt';
    let prefix = '';
    if (quizState.revealed) {
      if (oi === q.correct)                                  { cls += ' is-correct'; prefix = '✓ '; }
      else if (oi === quizState.selected && oi !== q.correct){ cls += ' is-wrong';   prefix = '✗ '; }
    } else if (oi === quizState.selected) { cls += ' is-selected'; }
    h += `<button class="${cls}" data-oi="${oi}" ${quizState.revealed ? 'disabled' : ''}>${prefix}${opt}</button>`;
  });
  h += '</div>';
  if (quizState.revealed) {
    if (q.explanation) h += `<div class="quiz-explanation">${q.explanation}</div>`;
    h += `<div class="quiz-next-row"><button class="btn-quiz-next" id="btnQNext">${qi + 1 < total ? 'Next Question →' : 'See Results →'}</button></div>`;
  }
  container.innerHTML = h;
  if (!quizState.revealed) {
    container.querySelectorAll('.quiz-opt').forEach(btn => {
      btn.addEventListener('click', () => {
        const oi = parseInt(btn.dataset.oi);
        quizState.selected = oi; quizState.revealed = true;
        if (oi === q.correct) quizState.score++;
        _renderQuizQ(container, id, lesson);
      });
    });
  } else {
    document.getElementById('btnQNext').addEventListener('click', () => {
      quizState.qIdx++; quizState.selected = null; quizState.revealed = false;
      if (quizState.qIdx >= qs.length) quizState.done = true;
      quizState.done ? _renderQuizResult(container, id, lesson) : _renderQuizQ(container, id, lesson);
    });
  }
}

function _renderQuizResult(container, id, lesson) {
  const score = quizState.score;
  const total = quizState.questions.length;
  const pass  = score >= Math.ceil(total * 0.7);
  if (pass) {
    prog[id] = { ...getProg(id), quizPassed: true, quizScore: score };
    saveProg(); renderModuleList(); updateOverallProgress();
    renderStepIndicator(id); renderCoachingMain(); renderCoachingSidebar();
    _updateNavBtn(id);
  }
  if (pass) {
    container.innerHTML = `<div class="quiz-result">
      <div class="quiz-result-icon">✅</div>
      <p class="quiz-result-title is-pass">Well done — ${score}/${total} correct</p>
      <p class="quiz-result-sub">Next lesson unlocked.</p>
      <button class="btn-quiz-result" id="btnContinue">Continue →</button>
    </div>`;
    const nextId = nextLesson(id);
    document.getElementById('btnContinue').addEventListener('click', () => { if (nextId) handleLessonClick(nextId); });
  } else {
    container.innerHTML = `<div class="quiz-result">
      <div class="quiz-result-icon">❌</div>
      <p class="quiz-result-title is-fail">${score}/${total} correct — minimum is ${Math.ceil(total * 0.7)}/${total}</p>
      <p class="quiz-result-retry">Review the lesson content and try again.</p>
      <button class="btn-quiz-result" id="btnRetry">Retry Quiz</button>
    </div>`;
    document.getElementById('btnRetry').addEventListener('click', () => {
      quizState = { lessonId: id, questions: _shuffleArr(lesson.quiz || []), qIdx: 0, selected: null, revealed: false, score: 0, done: false };
      renderQuizScreen(id);
    });
  }
}

/* ═══════════════════════════════════════════════════════════════
   INIT — deferred until DOM nodes are present (Elementor-safe)
═══════════════════════════════════════════════════════════════ */
let _initDone = false;

async function _runInit() {
  if (_initDone) return;

  // Verify all required nodes exist before touching them (Elementor may inject late)
  const required = ['playerRatio', 'lessonTitle', 'authorName', 'moduleList', 'coachingMain'];
  if (required.some(id => !document.getElementById(id))) {
    requestAnimationFrame(_runInit);
    return;
  }

  _initDone = true; // set before any await so concurrent calls bail out immediately

  // Attach sidebar listeners now that nodes are confirmed present
  const menuBtn = document.getElementById('menuBtn');
  const backdrop = document.getElementById('backdrop');
  if (menuBtn)  menuBtn.addEventListener('click', toggleSidebar);
  if (backdrop) backdrop.addEventListener('click', closeSidebar);

  // Load progress: server is source of truth; fall back to localStorage on failure
  const serverProg = await _loadProgServer();
  if (serverProg && Object.keys(serverProg).length > 0) {
    prog = serverProg;
    _applyProgDefaults(prog);
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(prog)); } catch {} // mirror locally
  } else {
    loadProg(); // localStorage fallback
  }

  // Unlock server saves — initial GET has resolved, prog is authoritative
  _progressLoaded = true;

  // Render UI with loaded progress
  renderModuleList();
  updateOverallProgress();
  renderCoachingMain();
  renderCoachingSidebar();

  // Resume last lesson (still tracked in localStorage as a UI hint)
  try {
    const last = localStorage.getItem(LAST_KEY);
    if (last && getLessonData(last) && !isPlaceholder(last) && isUnlocked(last)) {
      loadLesson(last);
    } else {
      loadLesson('1.1');
    }
  } catch {
    loadLesson('1.1');
  }
}

// Run as soon as DOM is ready; if already ready, call directly
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', _runInit, { once: true });
} else {
  _runInit();
}
</script>
