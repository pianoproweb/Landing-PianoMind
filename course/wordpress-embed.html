<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,700;1,400;1,500&family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap');

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --navy: #080D1A;
  --blue: #1B3A6B;
  --teal: #1D9E75;
  --gold: #D4A574;
  --g50:  #F9FAFB;
  --g100: #F3F4F6;
  --g200: #E5E7EB;
  --g400: #9CA3AF;
  --g500: #6B7280;
  --g600: #4B5563;
  --hdr:  60px;
}

html { scroll-behavior: smooth; }

body {
  background: var(--g50);
  color: var(--navy);
  font-family: 'DM Sans', sans-serif;
  min-height: 100vh;
}

:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

/* ── Header ─────────────────────────────────────────────── */
.hdr {
  position: fixed !important; top: 0 !important; left: 0 !important; right: 0 !important; height: var(--hdr) !important;
  background: var(--navy) !important;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 24px; z-index: 999999 !important;
  border-bottom: 1px solid rgba(255,255,255,0.06);
}
.elementor-page .hdr { z-index: 999999 !important; }
body.admin-bar .hdr { top: 32px !important; }
@media (max-width: 782px) { body.admin-bar .hdr { top: 46px !important; } }
.hdr-left  { display: flex; align-items: center; gap: 14px; }
.hdr-right { display: flex; align-items: center; gap: 12px; }

.hdr-menu-btn {
  display: none; align-items: center; justify-content: center;
  width: 36px; height: 36px; border-radius: 8px;
  border: 1px solid rgba(255,255,255,0.12);
  background: none; color: rgba(255,255,255,0.65); cursor: pointer;
  transition: border-color .2s, color .2s;
}
.hdr-menu-btn:hover { border-color: rgba(255,255,255,0.3); color: white; }

.hdr-brand { display: flex; align-items: center; gap: 10px; text-decoration: none; }
.hdr-brand img { height: 22px; width: auto; filter: brightness(0) invert(1); opacity: 0.85; }
.hdr-brand-name { font-family: 'Playfair Display', serif; font-size: 15px; font-weight: 500; color: white; }
.hdr-sep { width: 1px; height: 14px; background: rgba(255,255,255,0.12); }
.hdr-label {
  font-family: 'DM Mono', monospace; font-size: 9px;
  letter-spacing: 0.14em; text-transform: uppercase; color: rgba(255,255,255,0.38);
}

.hdr-progress { display: flex; align-items: center; gap: 10px; }
.hdr-progress-label {
  font-family: 'DM Mono', monospace; font-size: 9px;
  letter-spacing: 0.1em; color: rgba(255,255,255,0.38); white-space: nowrap;
}
.hdr-track {
  width: 100px; height: 3px;
  background: rgba(255,255,255,0.1); border-radius: 99px; overflow: hidden;
}
.hdr-fill {
  height: 100%; width: 0%; border-radius: 99px;
  background: linear-gradient(90deg, var(--teal), #28C78F);
  transition: width .6s ease;
}
.hdr-pct {
  font-family: 'DM Mono', monospace; font-size: 10px;
  color: var(--teal); min-width: 28px; text-align: right;
}

/* ── Layout grid ─────────────────────────────────────────── */
.layout {
  display: grid;
  grid-template-columns: 65fr 35fr;
  min-height: calc(100vh - var(--hdr)) !important;
  padding-top: var(--hdr) !important;
}
.elementor-page .layout { padding-top: var(--hdr) !important; }

/* ── Elementor Canvas full-width ─────────────────────────── */
section.elementor-section,
.elementor-top-section,
.elementor-section.elementor-section-boxed > .elementor-container,
.e-con,
.e-con > .e-con-inner {
  max-width: 100% !important;
  width: 100% !important;
  padding: 0 !important;
}
.elementor-widget-container {
  padding: 0 !important;
}

body.elementor-page {
  overflow-x: hidden !important;
}
section.elementor-section {
  margin: 0 !important;
  padding: 0 !important;
}
.elementor-row {
  margin: 0 !important;
  padding: 0 !important;
  width: 100% !important;
}
.elementor-column-gap-default > .elementor-column > .elementor-element-populated {
  padding: 0 !important;
}

/* ── Left column ─────────────────────────────────────────── */
.col-main { overflow-y: auto; }

/* ── Player ──────────────────────────────────────────────── */
.player-wrap {
  background: #070B16;
  border-radius: 0 0 12px 12px;
  overflow: hidden;
  box-shadow: 0 8px 32px rgba(8,13,26,0.18);
  margin-top: 0 !important;
}
.player-ratio {
  width: 100%; padding-top: 56.25%; position: relative;
  background: #070B16;
}
.player-ratio > * {
  position: absolute; inset: 0; width: 100%; height: 100%;
}
.player-ratio iframe { border: none; }

.player-welcome {
  display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 14px;
}
.pw-ring {
  width: 60px; height: 60px; border-radius: 50%;
  border: 1px solid rgba(255,255,255,0.08);
  display: flex; align-items: center; justify-content: center;
}
.pw-text {
  font-family: 'Playfair Display', serif; font-style: italic;
  font-size: 16px; color: rgba(255,255,255,0.22);
}

.player-locked {
  display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 10px;
  background: rgba(8,13,26,0.9); backdrop-filter: blur(12px);
}
.pl-icon { font-size: 28px; opacity: 0.5; }
.pl-title {
  font-family: 'Playfair Display', serif; font-size: 18px;
  font-weight: 500; color: white; opacity: 0.6;
}
.pl-sub {
  font-family: 'DM Sans', sans-serif; font-size: 13px;
  color: rgba(255,255,255,0.38); text-align: center; max-width: 280px; line-height: 1.6;
}

.player-coming-soon {
  display: flex; align-items: center; justify-content: center;
  background: var(--navy);
}
.player-coming-soon p {
  font-family: 'DM Sans', sans-serif; font-size: 18px;
  color: var(--g500); text-align: center; max-width: 340px; line-height: 1.6;
  padding: 0 24px;
}

/* ── Content area (padded) ───────────────────────────────── */
.col-inner { padding: 24px 32px 80px; }

/* ── Author + next ───────────────────────────────────────── */
.author-row {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 18px; gap: 12px;
}
.author-l { display: flex; align-items: center; gap: 12px; }
.author-avatar {
  width: 40px; height: 40px; border-radius: 50%; flex-shrink: 0;
  background: var(--navy); border: 2px solid var(--gold);
  display: flex; align-items: center; justify-content: center;
  font-family: 'Playfair Display', serif; font-size: 14px; font-weight: 500;
  color: var(--gold); letter-spacing: 0.02em; user-select: none;
}
.author-text { font-family: 'DM Sans', sans-serif; font-size: 14px; color: var(--g600); }
.author-text strong { color: var(--navy); font-weight: 600; }

.btn-next {
  display: inline-flex !important; align-items: center !important; gap: 6px !important;
  background: transparent !important; border: 1px solid var(--gold) !important;
  color: var(--gold) !important; font-family: 'DM Sans', sans-serif !important;
  font-size: 13px !important; font-weight: 500 !important; letter-spacing: 0.08em !important;
  text-transform: uppercase !important; padding: 8px 20px !important; border-radius: 6px !important;
  cursor: pointer !important; white-space: nowrap !important; flex-shrink: 0 !important;
  transition: background .2s, color .2s !important;
  text-decoration: none !important; box-shadow: none !important;
}
.btn-next:hover { background: var(--gold) !important; color: var(--navy) !important; }

/* ── Lesson info ─────────────────────────────────────────── */
.lesson-title {
  font-family: 'Playfair Display', serif;
  font-size: clamp(22px, 2.4vw, 32px);
  font-weight: 700; line-height: 1.2; color: var(--navy);
  margin-bottom: 12px;
}
.lesson-desc {
  font-family: 'DM Sans', sans-serif;
  font-size: 16px; line-height: 1.75; color: var(--g600);
}

/* ── Complete banner ─────────────────────────────────────── */
.complete-banner {
  display: none; flex-direction: column; align-items: center;
  text-align: center; padding: 48px 32px; gap: 10px;
  margin-top: 32px;
}
.complete-banner.is-visible { display: flex; }
.cb-icon { font-size: 32px; margin-bottom: 4px; }
.cb-title { font-family: 'Playfair Display', serif; font-size: 22px; font-style: italic; font-weight: 500; color: var(--navy); }
.cb-sub { font-family: 'DM Sans', sans-serif; font-size: 14px; color: var(--g500); }

/* ── Right sidebar ───────────────────────────────────────── */
.col-sidebar {
  background: white; border-left: 1px solid var(--g200);
  height: calc(100vh - var(--hdr)); position: sticky; top: var(--hdr);
  overflow-y: auto; overflow-x: hidden;
  scrollbar-width: thin; scrollbar-color: var(--g200) transparent;
  padding: 20px;
}
.col-sidebar::-webkit-scrollbar { width: 4px; }
.col-sidebar::-webkit-scrollbar-thumb { background: var(--g200); border-radius: 2px; }

/* ── Overall progress ────────────────────────────────────── */
.prog-row {
  display: flex; align-items: center; gap: 16px;
  margin-bottom: 20px; padding-bottom: 20px;
  border-bottom: 1px solid var(--g200);
}
.prog-text {
  flex: 1; font-family: 'DM Sans', sans-serif;
  font-size: 14px; color: var(--g600); line-height: 1.4;
}

/* ── Module cards ────────────────────────────────────────── */
.mod-card {
  background: white; border: 1px solid var(--g200);
  border-radius: 12px; overflow: hidden; margin-bottom: 12px;
}
.mod-card-hdr {
  padding: 16px 20px; background: var(--g50);
  border-bottom: 1px solid var(--g200);
}
.mod-card-top {
  display: flex; justify-content: space-between; align-items: flex-start;
  margin-bottom: 8px;
}
.mod-name {
  font-family: 'Playfair Display', serif; font-size: 15px;
  color: var(--navy); font-weight: 500; line-height: 1.3; flex: 1;
}
.mod-dur {
  font-family: 'DM Sans', sans-serif; font-size: 13px; color: var(--g500);
  flex-shrink: 0; padding-left: 8px;
}
.mod-tags { display: flex; gap: 6px; flex-wrap: wrap; }
.mod-tag {
  font-family: 'DM Sans', sans-serif; font-size: 11px; font-weight: 500;
  letter-spacing: 0.08em; text-transform: uppercase;
  padding: 3px 8px; border-radius: 4px;
}

/* ── Lesson rows ─────────────────────────────────────────── */
.lr {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 20px; border-top: 1px solid var(--g100);
  cursor: pointer; min-height: 64px;
  transition: background .15s;
}
.lr:hover:not(.lr--locked) { background: var(--g50); }
.lr.lr--active { background: #EEF2FF; }
.lr.lr--locked { opacity: 0.5; cursor: not-allowed; }
.lr.lr--coming-soon { opacity: 0.5; cursor: pointer; }
.lr.lr--coming-soon:hover { background: var(--g50); opacity: 0.65; }

.lr-icon { flex-shrink: 0; }
.lr-info { flex: 1; min-width: 0; }
.lr-title {
  display: block; font-family: 'DM Sans', sans-serif;
  font-size: 14px; color: var(--navy); font-weight: 400;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.lr--active .lr-title { font-weight: 600; }
.lr--locked .lr-title,
.lr--coming-soon .lr-title { color: var(--g400); }
.lr-dur {
  display: block; font-family: 'DM Sans', sans-serif;
  font-size: 13px; color: var(--g500); margin-top: 1px;
}

/* ── Mobile ──────────────────────────────────────────────── */
.sidebar-backdrop {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.55); z-index: 490;
}
.sidebar-backdrop.is-visible { display: block; }

@media (max-width: 1023px) {
  .layout { grid-template-columns: 60fr 40fr; }
}

@media (max-width: 767px) {
  .layout { grid-template-columns: 1fr; }
  .col-inner { padding: 20px 16px 60px; }

  .hdr-menu-btn { display: flex; }
  .hdr-track { width: 70px; }
  .hdr-sep, .hdr-label { display: none; }

  .player-wrap { border-radius: 0; box-shadow: none; }

  .col-sidebar {
    position: fixed; top: var(--hdr); right: 0;
    width: min(360px, 92vw); height: calc(100vh - var(--hdr));
    transform: translateX(100%); z-index: 500; border-left: none;
    box-shadow: none;
    transition: transform .32s cubic-bezier(.4,0,.2,1);
  }
  .col-sidebar.is-open {
    transform: translateX(0);
    box-shadow: -4px 0 24px rgba(0,0,0,0.14);
  }

  .lesson-title { font-size: 22px; }
  .lesson-desc  { font-size: 15px; }
}

/* ── Step Indicator ──────────────────────────────────────── */
.step-indicator {
  display: flex; align-items: flex-start;
  margin: 28px 0 0;
}
.step-node {
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  flex-shrink: 0;
}
.step-dot {
  width: 32px; height: 32px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 600;
  border: 2px solid #D1D5DB; color: #9CA3AF; background: white;
  transition: background .3s, border-color .3s, color .3s;
}
.step-dot.is-active { background: #080D1A; border-color: #080D1A; color: white; }
.step-dot.is-done   { background: #1D9E75; border-color: #1D9E75; color: white; }
.step-label {
  font-family: 'DM Sans', sans-serif; font-size: 9px; font-weight: 600;
  letter-spacing: 0.12em; text-transform: uppercase; color: #9CA3AF;
  white-space: nowrap; transition: color .3s;
}
.step-label.is-active { color: #080D1A; }
.step-label.is-done   { color: #1D9E75; }
.step-connector {
  flex: 1; height: 2px; background: #E5E7EB;
  margin-top: 15px; transition: background .3s;
}
.step-connector.is-done { background: #1D9E75; }

.step-indicator-mobile {
  display: none; flex-direction: column; gap: 8px; margin: 20px 0 0;
}
.step-mobile-text {
  font-family: 'DM Mono', monospace; font-size: 11px;
  letter-spacing: 0.1em; text-transform: uppercase; color: #6B7280;
}
.step-mobile-bar {
  height: 3px; background: #E5E7EB; border-radius: 99px; overflow: hidden;
}
.step-mobile-fill {
  height: 100%; background: #D4A574; border-radius: 99px; transition: width .4s ease;
}

@media (max-width: 767px) {
  .step-indicator        { display: none; }
  .step-indicator-mobile { display: flex; }
}

/* ── Lesson sections (theory / attachments / quiz) ───────── */
.ls-section {
  margin-top: 40px; padding-top: 36px;
  border-top: 1px solid #E5E7EB;
}
.ls-section-hdr {
  font-family: 'Playfair Display', serif; font-size: 28px;
  font-weight: 700; color: #080D1A; margin-bottom: 20px; line-height: 1.2;
}

/* Theory body */
.theory-body { max-width: 720px; }
.theory-body p {
  font-family: 'DM Sans', sans-serif; font-size: 16px;
  line-height: 1.8; color: #374151; margin-bottom: 16px;
}
.theory-body blockquote {
  border-left: 4px solid #D4A574; padding-left: 24px;
  font-style: italic; color: #6B7280; margin: 24px 0;
}
.theory-body strong { color: #080D1A; font-weight: 700; }

/* Mark/complete buttons */
.btn-mark {
  display: block; width: 100%; margin-top: 28px;
  background: #080D1A; color: #D4A574;
  font-family: 'DM Sans', sans-serif; font-size: 15px; font-weight: 600;
  border: none; border-radius: 10px; padding: 14px;
  cursor: pointer; text-align: center;
  transition: background .2s;
}
.btn-mark:hover { background: #111827; }

/* Step done label */
.step-done-label {
  font-family: 'DM Sans', sans-serif; font-size: 13px;
  color: #1D9E75; font-weight: 600; margin-top: 20px;
  display: flex; align-items: center; gap: 6px;
}

/* Attachments grid */
.att-grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 4px;
}
@media (max-width: 767px) { .att-grid { grid-template-columns: 1fr; } }
.att-card {
  display: flex; align-items: center; gap: 14px;
  background: white; border: 1px solid #E5E7EB;
  border-radius: 12px; padding: 16px;
  text-decoration: none; color: inherit;
  transition: border-color .2s;
}
.att-card:hover { border-color: #080D1A; }
.att-icon {
  width: 48px; height: 48px; border-radius: 10px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
}
.att-content { flex: 1; min-width: 0; }
.att-name {
  font-family: 'DM Sans', sans-serif; font-size: 15px; font-weight: 600;
  color: #080D1A; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.att-desc {
  font-family: 'DM Sans', sans-serif; font-size: 13px;
  color: #6B7280; margin-top: 2px;
}
.att-arrow { color: #9CA3AF; flex-shrink: 0; }

/* Quiz */
.quiz-subtitle {
  font-family: 'DM Sans', sans-serif; font-size: 14px;
  color: #6B7280; margin-bottom: 20px; line-height: 1.6;
}
.quiz-progress-row {
  display: flex; justify-content: flex-end; margin-bottom: 6px;
}
.quiz-progress-label {
  font-family: 'DM Sans', sans-serif; font-size: 13px; color: #6B7280;
}
.quiz-progress-bar {
  height: 3px; background: #E5E7EB; border-radius: 99px;
  overflow: hidden; margin-bottom: 24px;
}
.quiz-progress-fill {
  height: 100%; background: #D4A574; border-radius: 99px; transition: width .3s;
}
.quiz-question-text {
  font-family: 'DM Sans', sans-serif; font-size: 18px;
  font-weight: 600; color: #080D1A; margin-bottom: 24px; line-height: 1.5;
}
.quiz-options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
.quiz-opt {
  width: 100%; text-align: left; padding: 16px 20px;
  font-family: 'DM Sans', sans-serif; font-size: 15px; color: #374151 !important;
  background: #FFFFFF !important; border: 1px solid #E5E7EB !important; border-radius: 10px;
  cursor: pointer; transition: background .15s, border-color .15s, color .15s;
  white-space: normal !important; overflow-wrap: break-word !important;
  word-break: break-word !important; height: auto !important; min-height: 0 !important;
  box-sizing: border-box !important;
}
.quiz-opt:hover:not([disabled]) { background: #F8F9FA !important; border-color: #080D1A !important; }
.quiz-opt.is-selected    { background: #080D1A !important; color: #FFFFFF !important; border-color: #080D1A !important; }
.quiz-opt.is-correct     { background: #1D9E75 !important; color: #FFFFFF !important; border-color: #1D9E75 !important; }
.quiz-opt.is-wrong       { background: #DC2626 !important; color: #FFFFFF !important; border-color: #DC2626 !important; }
.quiz-opt.is-correct-hint{ border: 2px solid #1D9E75 !important; }
.quiz-explanation {
  background: #F8F9FA; border-left: 4px solid #D4A574;
  border-radius: 8px; padding: 16px; margin-bottom: 20px;
  font-family: 'DM Sans', sans-serif; font-size: 14px;
  color: #374151; font-style: italic; line-height: 1.6;
}
.quiz-next-row { display: flex; justify-content: flex-end; }
.btn-quiz-next {
  background: #080D1A; color: #D4A574;
  font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 600;
  border: none; border-radius: 8px; padding: 12px 24px;
  cursor: pointer; transition: background .2s;
}
.btn-quiz-next:hover { background: #111827; }
.quiz-result {
  text-align: center; padding: 40px 24px;
  display: flex; flex-direction: column; align-items: center; gap: 12px;
}
.quiz-result-icon { font-size: 48px; margin-bottom: 8px; }
.quiz-result-title {
  font-family: 'Playfair Display', serif; font-size: 28px;
  font-weight: 700; line-height: 1.2;
}
.quiz-result-title.is-pass { color: #1D9E75; }
.quiz-result-title.is-fail { color: #DC2626; }
.quiz-result-sub   { font-family: 'DM Sans', sans-serif; font-size: 16px; color: #6B7280; }
.quiz-result-retry { font-family: 'DM Sans', sans-serif; font-size: 14px; color: #6B7280; margin-top: 4px; }
.btn-quiz-result {
  margin-top: 8px; background: #080D1A; color: #D4A574;
  font-family: 'DM Sans', sans-serif; font-size: 15px; font-weight: 600;
  border: none; border-radius: 10px; padding: 14px 32px;
  cursor: pointer; transition: background .2s;
}
.btn-quiz-result:hover { background: #111827; }

/* ── Coaching main section ───────────────────────────────── */
@keyframes pulse-glow {
  0%,100% { box-shadow: 0 0 20px rgba(27,111,255,.6), 0 0 40px rgba(27,111,255,.3), inset 0 0 20px rgba(27,111,255,.05); }
  50%      { box-shadow: 0 0 40px rgba(27,111,255,.9), 0 0 80px rgba(27,111,255,.5), 0 0 120px rgba(27,111,255,.2), inset 0 0 30px rgba(27,111,255,.1); }
}
@keyframes btn-pulse {
  0%,100% { transform: scale(1); }
  50%     { transform: scale(1.02); }
}
.coaching-main {
  background: #0D1221; border-radius: 20px;
  padding: 48px; margin-top: 48px; text-align: center;
  transition: border-color .8s;
}
@media (max-width: 767px) { .coaching-main { padding: 32px 20px; } }
.coaching-main.is-locked   { border: 1px solid rgba(27,111,255,.15); }
.coaching-main.is-unlocked { border: 1px solid #1B6FFF; animation: pulse-glow 2s ease-in-out infinite; }

.coaching-label {
  font-family: 'DM Sans', sans-serif; font-size: 11px;
  letter-spacing: .15em; text-transform: uppercase; margin-bottom: 16px;
}
.coaching-main.is-locked   .coaching-label { color: rgba(255,255,255,.25); }
.coaching-main.is-unlocked .coaching-label { color: #1B6FFF; text-shadow: 0 0 10px rgba(27,111,255,.8); }

/* ═══════════════════════════════════════════════════════════════
   COURSE DATA
═══════════════════════════════════════════════════════════════ */
const modules = [
  {
    id: 1,
    title: 'Piano Productivity',
    description: 'Evidence-based strategies for structuring practice sessions, setting measurable goals, and building sustainable habits.',
    tag1: { label: 'FOUNDATIONS', bg: '#1D9E75', color: '#FFFFFF' },
    tag2: { label: 'MODULE 1',    bg: '#D4A574', color: '#080D1A' },
    lessons: [
      { id: '1.1', vimeoId: '1190747389', title: 'Welcome',                         instructor: 'Michelangelo Salamone', duration: null, theory: '', attachments: [], quiz: [] },
      { id: '1.2', vimeoId: '1190747443', title: 'Micro and macrogoals',             instructor: 'Michelangelo Salamone', duration: null,
        theory: "<p><strong>The principle.</strong> Every long-term ambition in a pianist's career is a <em>macro goal</em>: winning a specific competition, debuting in a major hall, recording a complete cycle. A macro goal sets direction — it is a North Star. But direction is not instruction. It tells you where you are going and says nothing about what to do tomorrow morning at the instrument. That is why ambition alone so often leads to drifting practice.</p><p>To turn direction into action, the macro goal must be broken into <em>micro goals</em> — smaller, concrete targets that a single practice period can act on. And the breakdown is recursive: any micro goal that is still too large can be split again into sub-steps, until each item is small enough to enter daily practice. Winning a competition, for example, breaks into choosing the right program, finding a world-class teacher, training the mind for stress, and performing the repertoire in real contexts — and that last step breaks again into daily technical work, repertoire testing, endurance trials, and home simulation.</p><p>The tool that makes this possible is <em>analytical thinking</em>: decomposing each action into its influential parameters and separating what truly matters from what is noise. A further filter sharpens the whole process — favour targets you <em>control</em>. \"Winning\" depends on juries and the field; \"simulating performance arousal at home\" depends only on you. The principle, in short: ambition lives at the top, but progress is built from controllable micro steps below it.</p><p><strong>What the science says.</strong> This is not a motivational idea — it rests on robust research. <strong>K. Anders Ericsson's</strong> work on expert performance shows that elite performers do not chase distant outcomes directly; they convert them into specific, attainable targets that each session can address, with immediate feedback. <strong>Locke and Latham's goal-setting theory</strong> adds the mechanism: specific and proximal goals produce significantly higher performance than vague, distant ones, because they give the mind a concrete object to act on and a clear way to measure progress. Decomposing a macro goal into controllable micro steps is the practical application of both findings — it is how ambition becomes a trainable daily practice rather than a wish.</p><p><strong>— Experiential Exercise: Build Your Goal Planner —</strong></p><p>Set up a three-level planner for one real goal you are pursuing this season. Use three columns or three rows — long term, mid term, daily routine.</p><p><strong>Long term.</strong> Write a single macro goal at the top (a specific competition, audition, or recital). This is your North Star — it sets direction, nothing more.</p><p><strong>Mid term.</strong> Break that macro goal into exactly four micro steps, each one a process you control rather than an outcome you hope for. Then take the one micro step that matters most right now and break it again into its own sub-steps. Stop when each item is concrete enough to act on.</p><p><strong>Daily routine.</strong> From the lowest level of your breakdown, extract the actions small enough to enter your daily practice. For each daily item, write the one influential parameter that decides whether it works — the variable you will actually watch. Run only the first daily item this week and log what that parameter did, so your planner stays built on real feedback, not assumptions.</p>",
        attachments: [],
        quiz: [
          { question: "Why does the lesson argue that a macro goal does not guide us?", options: ["It is too ambitious to ever achieve", "It sets direction but contains no actionable instructions", "It depends only on talent", "It cannot be measured"], correct: 1, explanation: "A macro goal functions as a North Star — it orients ambition but says nothing about the concrete actions needed to move forward. Guidance comes only from micro steps." },
          { question: "What does being analytical mean in this framework?", options: ["Practicing slowly and carefully", "Listening to many recordings before deciding", "Breaking an action into small influential parameters and separating what matters from what does not", "Following a teacher's instructions precisely"], correct: 2, explanation: "Analysis here is decomposition plus prioritization — isolating the parameters that actually drive a result and discarding the noise." },
          { question: "Why does the lesson recommend against winning the Chopin Competition as a working goal?", options: ["It is unrealistic for most pianists", "Its outcome depends on factors outside the pianist's control", "It takes too many years", "Competitions are not useful for a career"], correct: 1, explanation: "Outcome goals hinge on juries, the field, and chance. Controllable process goals are more trainable and more reliable as a daily compass." },
          { question: "In the lesson, simulating performances at home is an example of what?", options: ["A macro goal", "A first-level micro step", "A sub-step of a micro step (a deeper level of decomposition)", "An optional warm-up"], correct: 2, explanation: "It sits two levels down — a sub-step of performing in real execution contexts, which is itself a micro step of the macro goal. Decomposition is recursive." },
          { question: "According to goal-setting research, which goals produce higher performance?", options: ["Distant and ambitious goals", "Specific and proximal goals", "Goals set by a teacher rather than the student", "Goals kept flexible and undefined"], correct: 1, explanation: "Locke and Latham found specific, near-term goals outperform vague, distant ones because they give the mind a concrete target and immediate feedback on progress." }
        ]
      },
      { id: '1.3', vimeoId: '1190747481', title: 'Do it well and do it now',         instructor: 'Michelangelo Salamone', duration: null,
        theory: "<p><strong>The principle.</strong> \"Do it well and do it now\" sounds like a slogan, but it encodes a precise rule for motor learning: find the right method in the shortest possible time, and reach the result before a flawed habit sets in. The urgency is not about speed for its own sake — it is about a hard biological deadline built into how the body learns movement.</p><p>That deadline is the <em>overlearned movement</em>. After hundreds of repetitions, a motor pattern becomes automated: the neuromuscular system absorbs it and no longer needs conscious control to run it. This is the goal of practice — automaticity frees attention for music. But automaticity is indifferent to quality. If the pattern you repeat four hundred times is inefficient or wrong, you do not overlearn a passage; you overlearn a mistake, and now it runs on autopilot, resistant to correction.</p><p>The practical consequence is a reversed order of priorities. Before drilling a passage, you must first <em>investigate the most effective way to approach it</em> — because repetition locks in whatever you feed it. There are two roads to finding that way: a mentor who has already solved that passage and can hand you the efficient solution, or systematic self-testing, where you try an approach and check whether it actually works for your hand, your endurance, your arm. The strongest option is both — a mentor's solution, validated against your own body.</p><p><strong>What the science says.</strong> This rests on well-established findings in motor learning. The <strong>Fitts and Posner</strong> three-stage model describes how movement passes from a cognitive stage, through an associative stage, to an autonomous stage where it runs without conscious oversight — exactly the automation the lesson calls overlearning. Research on <strong>procedural memory and automaticity</strong> shows why this matters: once a motor program reaches the autonomous stage, it becomes highly stable and far harder to unlearn than to learn, because correcting it means overwriting a consolidated pattern rather than writing a fresh one. This is the scientific basis for front-loading quality: the cost of a wrong movement is not linear, it compounds with every repetition that drives it deeper into automation.</p><p><strong>— Experiential Exercise —</strong></p><p>Choose a passage you have <em>not</em> yet drilled — something new in your current repertoire. Before any repetition, spend one session investigating, not practicing: test at least two distinct approaches to the same passage (different fingering, distribution between hands, or motion strategy). For each, note how it feels for your hand, arm, and endurance — the parameters that decide whether it will survive automation. Only after you have identified the most effective approach do you begin repeating it. The point is to spend your first repetitions on the right solution, not on discovering it the hard way. If you have access to a mentor's solution, test it against your own body rather than adopting it blindly.</p>",
        attachments: [],
        quiz: [
          { question: "What does overlearned movement mean?", options: ["A movement practiced too fast", "A movement that, after hundreds of repetitions, becomes automated and no longer needs conscious control", "A movement that is too difficult to master", "A movement learned from a mentor"], correct: 1, explanation: "Overlearning is the point where the neuromuscular system has absorbed a pattern and runs it on autopilot, without conscious oversight." },
          { question: "Why is the timing of do it now so important?", options: ["Because fast practice builds endurance", "Because competitions have deadlines", "Because once a movement is automated it becomes very hard to unlearn, so quality must come before repetition", "Because slow learners fall behind"], correct: 2, explanation: "Automation is indifferent to quality. The window to fix a pattern closes as repetition drives it into the autonomous stage." },
          { question: "What is the real risk of repeating an unoptimized pattern 400 times?", options: ["Physical fatigue", "You overlearn the mistake, automating a flawed movement that resists correction", "You lose motivation", "You memorize the wrong notes"], correct: 1, explanation: "Repetition locks in whatever it is fed. An inefficient pattern, repeated enough, becomes a stable automatic habit." },
          { question: "What does the lesson recommend doing BEFORE drilling a passage?", options: ["Playing it at full tempo once", "Memorizing the notes", "Investigating the most effective way to approach it", "Repeating it slowly many times"], correct: 2, explanation: "Because repetition consolidates whatever approach you use, the efficient approach must be found first, not discovered through drilling." },
          { question: "Which model from motor-learning research describes movement becoming automatic?", options: ["Locke and Latham's goal-setting theory", "Ericsson's deliberate practice", "The Fitts and Posner three-stage model (cognitive, associative, autonomous)", "Csikszentmihalyi's flow model"], correct: 2, explanation: "Fitts and Posner describe the progression to the autonomous stage, where movement runs without conscious control — the automation the lesson calls overlearning." }
        ]
      },
      { id: '1.4', vimeoId: '1190747511', title: 'The importance of deadlines',      instructor: 'Michelangelo Salamone', duration: null,
        theory: "<p><strong>The principle.</strong> A goal without a date is not a goal — it is a wish. Deadlines do three concrete things for a pianist: they keep focus high, they force prioritization, and they make time management possible. Anything you do not write down and assign a clear date to simply will not happen, or will struggle to. The deadline is what converts intention into a path.</p><p>But a single long-term deadline is not enough on its own. Take a real case: performing the Bach Goldberg Variations in six months. Knowing the six-month target tells you nothing about today. The long-term goal must be broken into mid-term and short-term deadlines, each one dated. First month: read the whole work — if it is forty pages, that is roughly one and a half pages a day, and that daily quota is your routine. Second month: optimize each variation deeply — thirty variations across thirty days, one per day. Third and fourth months: deep memorization — half a variation per day finishes the work in two months. Each layer turns a distant ambition into a precise daily action.</p><p>The power of dated milestones is that they make the abstract measurable. \"Perform the Goldberg in six months\" is unactionable; \"read one and a half pages today\" is something you either did or did not do. This is what gives the long/mid/daily structure its force: every level is anchored to a date, and every date produces a number you can check against reality.</p><p><strong>What the science says.</strong> This connects directly to <strong>Locke and Latham's goal-setting theory</strong>: proximal, dated sub-goals produce higher performance than a single distant deadline, because they supply continuous feedback and prevent the drift that open-ended timelines invite. It also reflects the well-documented <strong>planning-and-deadline literature</strong> on how time-bound, specific commitments raise task completion rates compared with vague intentions. A deadline is not pressure for its own sake — it is the structure that lets motivation and feedback operate.</p><p><strong>— Experiential Exercise —</strong></p><p>Take a substantial work you intend to bring to performance and assign it a single realistic long-term date. Then build the layers downward: define your mid-term milestones (reading complete, optimization complete, memorization complete) each with its own date, and convert the nearest milestone into a daily quota you can measure — pages per day, variations per day, sections per day. Write every date down. At the end of each day, mark only whether you hit the quota, yes or no. The exercise is to make every level of the goal answerable to a date and a number, so progress stops being a feeling and becomes a record.</p>",
        attachments: [],
        quiz: [
          { question: "According to the lesson, what are the three things deadlines do?", options: ["Keep focus high, force prioritization, and enable time management", "Increase speed, reduce errors, and build memory", "Impress the jury, satisfy the teacher, and fill time", "Slow practice, add pressure, and shorten the work"], correct: 0, explanation: "These three effects are why a dated target outperforms an open-ended intention." },
          { question: "Why is knowing only the six-month deadline for the Goldberg Variations not enough?", options: ["It is too ambitious", "It is the long-term goal and gives no instruction for what to do today", "Six months is too short", "The work is too long"], correct: 1, explanation: "A long-term date sets the endpoint but must be broken into mid- and short-term dated steps to guide daily action." },
          { question: "In the example, how is the first-month reading goal turned into a daily routine?", options: ["By reading until tired", "By dividing the page count by the days available (about one and a half pages per day)", "By practicing one variation a day", "By memorizing first"], correct: 1, explanation: "A dated mid-term milestone becomes actionable only when divided into a measurable daily quota." },
          { question: "Why does a dated milestone make a goal more powerful?", options: ["It adds pressure", "It impresses a mentor", "It turns an abstract ambition into something measurable you either did or did not do", "It shortens the work"], correct: 2, explanation: "Measurability is what lets you check progress against reality and prevents drift." },
          { question: "Which research best supports breaking one deadline into dated sub-goals?", options: ["Fitts and Posner", "The Hawthorne effect", "Locke and Latham's goal-setting theory", "Parkinson's Law"], correct: 2, explanation: "Proximal, specific, dated sub-goals produce higher performance and continuous feedback versus a single distant deadline." }
        ]
      },
      { id: '1.5', vimeoId: '1190747591', title: 'Productivity habits',              instructor: 'Michelangelo Salamone', duration: null,
        theory: "<p><strong>The principle.</strong> Three psychological mechanisms quietly govern how productive your practice is. The first is the <em>endowed progress effect</em>: once you feel you have already made progress toward a goal, you become more motivated to finish it. This is why dated short-term goals compound — each milestone reached strengthens the drive toward the next, because you are no longer starting from zero.</p><p>The second is <em>Parkinson's Law</em>: work expands to fill the time available for its completion. If you give a concerto a year and you are disciplined, it will be ready in a year. But if the real deadline is nine months, you will marshal the effort to make it in nine — the work compresses to fit the time. There is a floor to this compression, set by your level of expertise and the difficulty of the piece, and pushing past it leads to burnout. The lesson is not to rush recklessly, but to recognize that loose timelines invite wasted time, while honest, tighter deadlines unlock capacity you did not know you had.</p><p>The third is the <em>Hawthorne effect</em>: people change their behavior when they know they are being observed. A pianist who knows a mentor, colleague, or friend is watching naturally sustains higher concentration and effort. This is a lever you can deliberately pull rather than wait for.</p><p><strong>What the science says.</strong> All three are documented effects. The <strong>endowed progress effect</strong> was demonstrated by Nunes and Dreze, who showed that artificial initial progress sharply increases completion rates. <strong>Parkinson's Law</strong>, originally an observation by Cyril Northcote Parkinson, is supported by research on time allocation showing that generous deadlines reduce efficiency without improving quality. The <strong>Hawthorne effect</strong>, named after the Western Electric studies, captures how observation alters performance. Together they explain why structured deadlines and visible accountability make practice measurably more effective.</p><p><strong>— Experiential Exercise —</strong></p><p>Run a one-week test combining all three effects. Take a piece you could \"naturally\" prepare in three months and set a deliberately tighter, honest deadline — without crossing into the territory that risks burnout. Break it into dated short-term goals so each completed step feeds the next (endowed progress). Then, for at least three practice sessions this week, open a live video room — Zoom, Meet, or a private stream — and share it with a mentor or colleague so you are genuinely observed (Hawthorne). Afterward, note where your focus and output differed from your usual unobserved practice. The goal is to feel, directly, how time pressure and observation change your effective capacity.</p>",
        attachments: [],
        quiz: [
          { question: "What is the endowed progress effect?", options: ["Rewarding yourself after a task", "Feeling you have already made progress toward a goal increases your motivation to complete it", "Observing others' progress", "Setting easy goals first"], correct: 1, explanation: "Perceived initial progress raises completion drive — which is why dated milestones compound." },
          { question: "What does Parkinson's Law state?", options: ["Harder work takes more time", "Work expands to fill the time available for its completion", "Deadlines cause anxiety", "Practice improves with repetition"], correct: 1, explanation: "Generous timelines invite wasted time; tighter honest deadlines compress the work to fit." },
          { question: "What limits how far you can compress a deadline?", options: ["Your motivation", "The number of hours per day", "Your level of expertise and the difficulty of the work", "Your mentor's approval"], correct: 2, explanation: "There is a real floor to compression; pushing past it risks burnout rather than gains." },
          { question: "What is the Hawthorne effect?", options: ["Rewards reinforce habits", "Progress builds motivation", "People change their behavior when they know they are being observed", "Pressure improves focus"], correct: 2, explanation: "Awareness of observation tends to raise concentration and effort — a lever you can deliberately use." },
          { question: "How does the lesson suggest applying the Hawthorne effect to practice?", options: ["Record yourself for later", "Practice in a concert hall", "Share a live practice session with a mentor or colleague so you are observed", "Compete with another pianist"], correct: 2, explanation: "A shared live room creates genuine observation, raising focus and productivity in real time." }
        ]
      },
      { id: '1.6', vimeoId: '1190747621', title: 'How to create or destroy habits',  instructor: 'Michelangelo Salamone', duration: null,
        theory: "<p><strong>The principle.</strong> Every pianist carries good habits and bad ones; the goal is to build the good and dismantle the bad. Both follow the same four-part structure, run in opposite directions. To <em>create</em> a good habit, make it obvious, attractive, easy, and satisfying. To <em>break</em> a bad one, make it invisible, unattractive, difficult, and unsatisfying.</p><p>Building a good habit works through four moves. <em>Obvious</em>: use a habit tracker to surface what is really happening in your practice — the thumb-scrolling or messaging you do not notice — then use an implementation intention (\"I will do this, at this time, in this place\"), a written commitment like a deadline. <em>Attractive</em>: pair a duty with a pleasure — link reading a Prokofiev sonata you resist to playing the Liszt you love. <em>Easy</em>: reduce friction by removing steps (put the score on the piano in advance), reserve your highest-energy hours for the hardest tasks, and use the two-minute rule to overcome the inertia of starting. <em>Satisfying</em>: reinforce success with a genuine reward.</p><p>Breaking a bad habit reverses each move. <em>Invisible</em>: limit exposure to unproductive cues — phone, scrolling. <em>Unattractive</em>: make the long-term cost of the behavior vivid. <em>Difficult</em>: add friction — phone in another room, switched off, or app-limited. <em>Unsatisfying</em>: find an accountability partner and sign a habit contract, so that breaking the habit carries a real mental cost — the cost of disappointing someone you do not want to disappoint.</p><p><strong>What the science says.</strong> This four-part framework is drawn from <strong>James Clear's <em>Atomic Habits</em></strong>, which synthesizes behavioral research into the four laws of behavior change. It rests on the established <strong>cue-craving-response-reward loop</strong> from habit psychology, and on findings that <strong>implementation intentions</strong> (Gollwitzer's research) substantially raise follow-through by pre-deciding when, where, and how an action will occur. <strong>Accountability and commitment-device research</strong> confirms that publicly binding contracts increase adherence by attaching a tangible cost to failure. The science is clear: habits change faster by redesigning their environment and friction than by relying on willpower.</p><p><strong>— Experiential Exercise —</strong></p><p>Pick one good habit to build and one bad habit to break, and engineer both. For the good habit, apply all four laws explicitly: track it, write an implementation intention with a fixed time and place, pair it with something you enjoy, remove one source of friction, and define a reward. For the bad habit, reverse them: hide the cue, make its long-term cost explicit, add at least one friction step, and recruit an accountability partner with a signed habit contract. Run both for one week and record adherence daily. The exercise is to treat habit change as environment design, not willpower.</p>",
        attachments: [],
        quiz: [
          { question: "What are the four laws for creating a good habit?", options: ["Make it obvious, attractive, easy, and satisfying", "Make it invisible, unattractive, difficult, and unsatisfying", "Make it fast, slow, hard, and easy", "Make it written, dated, tracked, and rewarded"], correct: 0, explanation: "These are the four laws of behavior change applied to building habits; breaking them reverses each one." },
          { question: "What is the purpose of a habit tracker in the make it obvious step?", options: ["To reward yourself", "To compete with others", "To surface unnoticed behaviors in your practice so you can see what is really happening", "To schedule deadlines"], correct: 2, explanation: "You cannot change what you do not notice; the tracker makes hidden practice habits visible." },
          { question: "What is an implementation intention?", options: ["A reward after practice", "A written commitment specifying what you will do, at what time, in what place", "A long-term goal", "A mentor's instruction"], correct: 1, explanation: "Pre-deciding the when, where, and how of an action sharply raises follow-through." },
          { question: "How do you make a bad habit harder to perform?", options: ["Reward yourself less", "Practice at night", "Increase friction by adding steps before the action (e.g. phone in another room)", "Track it daily"], correct: 2, explanation: "Breaking a habit reverses make it easy — adding friction discourages the unwanted action." },
          { question: "How does an accountability partner make a bad habit unsatisfying?", options: ["It rewards good behavior", "It tracks your progress", "It attaches a real mental cost — the pain of disappointing someone — to the behavior", "It makes the habit invisible"], correct: 2, explanation: "A signed habit contract with a partner gives failure a tangible social cost, raising adherence." }
        ]
      }
    ]

  {
    id: 2,
    title: 'Score Reading',
    description: 'Systematic approaches to sight-reading, score analysis, and developing structural comprehension across styles.',
    tag1: { label: 'SKILLS',   bg: '#1B3A6B', color: '#FFFFFF' },
    tag2: { label: 'MODULE 2', bg: '#D4A574', color: '#080D1A' },
    lessons: [
      { id: '2.1', vimeoId: '1196631185', title: 'Score reading stages',              instructor: 'Michelangelo Salamone', duration: null, theory: "<p><strong>The principle.</strong> Reading a score and playing it in real time is not one act but three, chained together. Simultaneous reading is the product of hearing, sight, and movement — and the decoding process is not a single stream but unfolds in three distinct stages, each drawing on a different kind of memory.</p><p>The first stage is <em>auditory working memory</em>, the predictive phase. If you have heard Rachmaninov's Third Concerto thousands of times, you already know how it sounds bar after bar; your imagination runs ahead and anticipates the sound before you produce it. This is a feed-forward: you know what is coming. The second stage is <em>visual working memory</em>. Decoding begins at the eyes and alternates between <em>fixations</em> — the instant your eyes stop on a note or chord to decode it — and <em>saccades</em>, the ultra-fast jumps that shift visual attention from one group of symbols to the next. You fixate, decode, jump, fixate again. The third stage is <em>kinesthesia</em>: after the symbols are decoded, the nervous system assembles the sequence of movements to activate, from torso and shoulders down through arms, forearms, and fingers.</p><p>What makes this practical is that each stage improves through a different kind of exposure. Auditory expertise — how well you predict melodic profiles — grows with how often you have listened. Visual expertise — how fast you decode symbols — grows with how much you have read, exactly as a child who starts reading words at age four decodes more fluently each year. Motor expertise — how well you reproduce patterns, familiar or new — grows with how many times you have physically repeated them. Sight reading improves by training all three, not one.</p><p><strong>What the science says.</strong> Each stage maps to documented research. The <strong>fixation/saccade model of eye movement</strong> comes from reading-science research (Rayner and colleagues) showing that skilled readers make shorter fixations and more efficient saccades. The predictive role of <strong>auditory working memory</strong> aligns with Baddeley's working-memory model and with research on audiation — the internal hearing of music before it sounds. The motor stage reflects the <strong>procedural-memory</strong> findings already seen in the methodology module: motor patterns strengthen with repetition. Sight reading, in short, is a multi-sensory skill built from three trainable components.</p><p><strong>— Experiential Exercise —</strong></p><p>Take a passage you do not know — ideally from a composer whose idiom you have heard but never read. Decode it isolating each stage in turn. First, with the score closed in front of you mentally, predict the sound from memory of the style alone (auditory). Then open it and consciously track your own fixations and saccades: notice where your eyes stop, how large a group you take in per fixation, and where the jumps land (visual). Finally, before touching the keys, name the motor sequence each decoded group will require — the gesture, not just the notes (kinesthetic). Only then play. The aim is to feel which of the three stages is your bottleneck on unfamiliar music, because that is the one to train.</p>", attachments: [], quiz: [{"question": "What are the three stages of simultaneous score reading?", "options": ["Sight, rhythm, dynamics", "Auditory working memory, visual working memory, kinesthesia", "Reading, memorizing, performing", "Fixation, saccade, repetition"], "correct": 1, "explanation": "Reading is a chain of hearing (prediction), sight (decoding), and movement (execution)."}, {"question": "What is the predictive phase in reading?", "options": ["Visually scanning the whole page", "Auditory working memory imagining the sound before you play it", "Repeating a passage mentally", "Planning fingering"], "correct": 1, "explanation": "A trained auditory memory runs ahead as a feed-forward, anticipating the sound to come."}, {"question": "What is a saccade?", "options": ["The pause to decode a chord", "The moment of playing a note", "The ultra-fast eye movement shifting attention from one group of notes to the next", "A memory lapse"], "correct": 2, "explanation": "Fixation is the stop to decode; the saccade is the rapid jump between fixations."}, {"question": "What does kinesthetic memory depend on?", "options": ["How often you have heard the piece", "How many similar patterns you have seen", "How many times you have physically repeated the pattern", "Your reading age"], "correct": 2, "explanation": "Each stage strengthens differently — auditory with listening, visual with reading, motor with repetition."}, {"question": "According to the lesson, how is sight reading best improved?", "options": ["By reading faster", "By training all three kinds of expertise — auditory, visual, and motor", "By memorizing more", "By playing scales daily"], "correct": 1, "explanation": "Sight reading is multi-sensory; gains come from developing each component, not one alone."}] },
      { id: '2.2', vimeoId: '1196632389', title: 'Score reading example',             instructor: 'Michelangelo Salamone', duration: null, theory: "<p><strong>The principle.</strong> The three-stage model becomes concrete the moment you apply it to a real passage. Take the opening bars of Liszt's <em>Un sospiro</em>. The sequence runs in a fixed order. First, <em>auditory working memory</em>: you already know how the bars sound, so you predict the result before producing it. Second, <em>visual decoding</em>: you read the notes in groups, one cluster at a time — and where consecutive groups are identical, as in a repeating arpeggio figure, decoding accelerates because the pattern is recognized rather than read note by note. Third, <em>motor execution</em>: the body translates the decoded group into action, activating the chain from torso to fingers, and the speed of that activation depends entirely on how familiar the motor pattern already is.</p><p>The key insight from the worked example is the role of <em>pattern familiarity</em> at every stage. An arpeggio you have played a thousand times is decoded and executed almost instantly; the same shape in an unfamiliar configuration forces slower, note-by-note processing. Reading fluency is therefore not a single ability but the cumulative familiarity of the auditory, visual, and motor patterns a given passage contains.</p><p><strong>What the science says.</strong> This reflects <strong>chunking</strong> research in expertise psychology (Chase and Simon's work, later extended to music): experts read and reproduce material faster because they perceive meaningful groups rather than isolated symbols. The acceleration on repeated figures is pattern recognition replacing element-by-element decoding — the same mechanism that lets a fluent reader take in a familiar word at a glance.</p><p><strong>— Experiential Exercise —</strong></p><p>Choose two passages of comparable note-density: one built on figuration you know intimately (a common arpeggio or scale shape) and one built on figuration foreign to your hands (an irregular or contemporary configuration). Read both applying the three stages consciously, and time how long each fixation-to-execution cycle takes on each. You will find the familiar pattern collapses the three stages almost into one, while the foreign pattern forces them apart. The exercise reveals, directly, that your reading speed is a map of your pattern familiarity — and shows you exactly which unfamiliar shapes are worth drilling into recognizable chunks.</p>", attachments: [], quiz: [{"question": "In the worked example, what comes first when reading the bars?", "options": ["Predicting the sound via auditory working memory", "Decoding the notes visually", "Activating the fingers", "Choosing fingering"], "correct": 0, "explanation": "The sequence always begins with auditory prediction, then visual decoding, then motor execution."}, {"question": "Why does decoding accelerate on a repeating arpeggio figure?", "options": ["Arpeggios are always easy", "Identical groups are recognized as a pattern rather than read note by note", "The hand memorizes instantly", "The sound is louder"], "correct": 1, "explanation": "Recognized patterns bypass element-by-element decoding — the basis of reading fluency."}, {"question": "What determines the speed of the motor execution stage?", "options": ["How loud the passage is", "How many notes there are", "How familiar the motor pattern already is", "The tempo marking"], "correct": 2, "explanation": "A well-practiced pattern activates almost instantly; an unfamiliar one is slow."}, {"question": "According to chunking research, why do experts read faster?", "options": ["They have faster eyes", "They perceive meaningful groups instead of isolated symbols", "They memorize everything", "They read louder"], "correct": 1, "explanation": "Chunking lets experts process familiar groups at a glance rather than note by note."}, {"question": "What does the example reveal about reading fluency overall?", "options": ["It is a single fixed talent", "It depends only on eyesight", "It is the cumulative familiarity of a passage's auditory, visual, and motor patterns", "It cannot be trained"], "correct": 2, "explanation": "Fluency is built from pattern familiarity across all three stages, and is therefore trainable."}] },
      { id: '2.3', vimeoId: '1196632377', title: 'Shadow playing',                    instructor: 'Michelangelo Salamone', duration: null, theory: "<p><strong>The principle.</strong> Shadow playing is a training technique built on motor imagery: you read the score without playing, mentally visualizing the hand movements on the keyboard — which fingers, where and how to move the hands, wrist, and forearm, how to handle jumps and chord positions. It is playing the piano with the mind rather than the body. You visually and cognitively anticipate exactly what the body will do, without doing it.</p><p>Its central benefit is training the link between visual processing and motor planning, and in particular improving the <em>eye-hand span</em> (EHS) — the interval between the moment a note is seen and the moment it is played. A skilled reader's eyes run ahead of the hands; shadow playing widens that lead by rehearsing the visual-to-motor translation without the cost of physical execution. There is one critical caution: if you imagine the movement <em>with tension</em>, you will reproduce that tension when you play for real. The mental rehearsal must be done relaxed, or it trains the wrong thing.</p><p><strong>What the science says.</strong> The scientific backing is specific and important. Neuroscience shows that imagining a movement activates many of the same brain areas — the motor and premotor cortex — involved in actually executing it, though <em>not in the same way</em>: you are training the mind's representation, not the body's tissues. This is the well-documented <strong>motor imagery</strong> literature (work by Jeannerod and others on functional equivalence between imagined and executed action). Shadow playing leverages this to strengthen motor and visual cortex, develop multi-sensory integration, and consolidate functional motor patterns — provided the imagery stays tension-free.</p><p><strong>— Experiential Exercise —</strong></p><p>Choose a specific passage from your current repertoire. Close your eyes and build the keyboard in your mind. Now shadow-play it: imagine the exact hand movements — fingers, wrist, forearm, the negotiation of any jump or chord — at performance tempo, and crucially, imagine it <em>without any muscular tension</em>. If you notice tension creeping into the image, stop and reset until the imagined gesture feels free. Run the passage mentally several times, then play it for real and compare. Done daily, this widens your eye-hand span and rehearses the clean motor pattern before your body ever reinforces a tense one.</p>", attachments: [], quiz: [{"question": "What is shadow playing based on?", "options": ["Motor imagery — mentally rehearsing movements without playing", "Slow physical practice", "Playing with one hand", "Silent finger exercises on the lap"], "correct": 0, "explanation": "It is playing with the mind, visualizing the exact hand movements without physical execution."}, {"question": "What does eye-hand span (EHS) refer to?", "options": ["The distance between the hands", "The interval between a note being seen and being played", "The width of the visual field", "The gap between two saccades"], "correct": 1, "explanation": "EHS is how far the eyes read ahead of the hands; shadow playing widens it."}, {"question": "Why must shadow playing be done without tension?", "options": ["Tension breaks concentration", "Imagined tension is reproduced as real tension when you play", "It slows the imagery", "It tires the mind"], "correct": 1, "explanation": "The imagery trains the motor representation, so tension in the image transfers to physical execution."}, {"question": "What does neuroscience say about imagining a movement?", "options": ["It has no measurable brain effect", "It uses only visual cortex", "It activates many of the same motor and premotor areas as real execution, though not identically", "It replaces physical practice entirely"], "correct": 2, "explanation": "Motor imagery shows functional overlap with execution — you train the representation, not the body."}, {"question": "What does shadow playing primarily strengthen?", "options": ["Finger strength", "Breathing control", "The connection between visual processing and motor planning", "Sight-reading speed alone"], "correct": 2, "explanation": "It trains the visual-to-motor translation, improving anticipation and motor planning."}] },
      { id: '2.4', vimeoId: '1196632352', title: 'Moving window paradigm',            instructor: 'Michelangelo Salamone', duration: null, theory: "<p><strong>The principle.</strong> The moving window paradigm is a reading technique that restricts how much of the score you can see at once. You cover the page — with paper, or by zooming in on an iPad — leaving only a few measures visible: two, three, or four, and as few as one for a dense, virtuosic texture. As you read and play, you reveal only the next measures, advancing the window on a timer. The goal is to train the eye to move and process inside a restricted area without skipping ahead.</p><p>The problem it solves is a familiar one: when a pianist starts a new piece, enthusiasm pulls attention forward — you want to read the whole thing at once, and that scattering causes errors and shallow decoding. By covering everything except the active window, you force the brain to process the visible information more quickly, in a more orderly and contained way. To apply it: keep two or three measures visible, set a timer of one to three minutes depending on difficulty, optimize those measures, then move the window forward — completing the page section by section before advancing.</p><p><strong>What the science says.</strong> The technique is named after the <strong>moving-window paradigm</strong> in reading research (McConkie and Rayner), which experimentally limited the text visible around a reader's fixation to study the <em>perceptual span</em>. It connects to <strong>cognitive load</strong> management: by constraining the visual field, you reduce extraneous load and direct working memory at a small, fully processable unit. This is also, notably, how <strong>Sviatoslav Richter</strong> is reported to have worked — refusing to move on until everything on a single page was read and optimized.</p><p><strong>— Experiential Exercise —</strong></p><p>Take a new piece with real textural density. Physically cover the page so only two or three measures are visible. Set a timer — one to three minutes per window, scaled to difficulty — and within each window, read and optimize those measures fully before revealing the next. Do not let your eyes wander to upcoming material. Work the whole page this way before advancing, Richter-style. The exercise retrains the impulse to rush forward into a disciplined, contained scan that processes each unit completely — and you will notice the contrast the first time you remove the cover and feel how much the open page invites distraction.</p>", attachments: [], quiz: [{"question": "What does the moving window paradigm involve?", "options": ["Reading the whole page quickly", "Covering the score and revealing only a few measures at a time", "Playing without the score", "Reading only the right hand"], "correct": 1, "explanation": "A restricted visible window forces orderly, contained processing of each small unit."}, {"question": "What problem does it solve?", "options": ["Weak fingers", "Enthusiasm scattering attention forward and causing shallow decoding", "Poor memory", "Slow tempo"], "correct": 1, "explanation": "Covering upcoming material removes the temptation to rush ahead and keeps focus on the active unit."}, {"question": "How do you advance through the page?", "options": ["Reveal everything after one read", "Skip difficult bars", "Optimize the visible measures, then move the window forward on a timer", "Play hands separately"], "correct": 2, "explanation": "You complete each window before revealing the next, section by section."}, {"question": "What does the technique reduce, in cognitive-load terms?", "options": ["Motor effort", "Listening demand", "Extraneous load, by constraining the visual field to a processable unit", "Memorization time"], "correct": 2, "explanation": "Limiting what is visible directs working memory at a small, fully manageable chunk."}, {"question": "Which pianist is cited as working by a similar principle?", "options": ["Liszt", "Horowitz", "Sviatoslav Richter", "Rachmaninov"], "correct": 2, "explanation": "Richter reportedly refused to move on until a full page was read and optimized."}] },
      { id: '2.5', vimeoId: '1196632388', title: 'The 4 reading moments',             instructor: 'Michelangelo Salamone', duration: null, theory: "<p><strong>The principle.</strong> The difference between legendary concert pianists and standard students is often the framework they use from day one to concert day. The standard approach is sequential: read and optimize for a month or two, then memorize, then prepare for the concert. It works — but doing all of these together from the very first day produces far better results. The lesson lays out four key moments, run on each micro-section of the piece.</p><p><em>First, read in ultra-detail and perform only mentally.</em> Before touching the keyboard, take a small section — three or four bars — and imagine it completely, performing it in your mind to understand how it works inside the score. <em>Second, play it slowly.</em> After a couple of minutes of mental work, play it slowly hands separate around five times, then five times hands together. <em>Third, begin memorizing immediately</em> by detaching from the score: when you cannot recall something, make the retrieval effort before looking back, roughly five times (up to ten for harder material). <em>Fourth, optimize directly on what you have memorized</em>, with your final tempo already in mind — because your final tempo is the guide for your motor patterns.</p><p>The radical move here is collapsing reading, memorizing, and optimizing into one integrated pass on each micro-section, rather than treating them as separate phases separated by weeks. Memorization starts on day one, not month two.</p><p><strong>What the science says.</strong> Two well-established findings support this. The instruction to attempt recall before checking the score is <strong>retrieval practice</strong> (the testing effect, Roediger and Karpicke): effortful retrieval produces far stronger memory than re-reading. Integrating the phases rather than blocking them reflects <strong>interleaving and the desirable-difficulties</strong> literature (Bjork): mixing reading, recall, and optimization in one pass is harder in the moment but yields more durable learning. Practicing with the final tempo in mind connects to motor-learning research on specificity — patterns are best built toward their target execution conditions from the start.</p><p><strong>— Experiential Exercise —</strong></p><p>Take the opening micro-section (three or four bars) of a new piece and run all four moments in a single sitting. Imagine and mentally perform it before playing. Play slowly, five times hands separate, five times together. Then close the score and attempt to reconstruct it from memory, making the retrieval effort before peeking, five times. Finally, optimize what you have memorized with the final tempo as your reference. Do this micro-section by micro-section. The exercise replaces the slow read-then-memorize sequence with the integrated, day-one framework — and the early retrieval effort is deliberately uncomfortable because that discomfort is what builds durable memory.</p>", attachments: [], quiz: [{"question": "What separates legendary pianists from standard students, according to the lesson?", "options": ["Natural talent", "Hours of practice", "The framework used from day one to concert day", "Quality of instrument"], "correct": 2, "explanation": "Integrating reading, memorizing, and optimizing from the start, rather than in sequence, yields better results."}, {"question": "What is the first of the four moments?", "options": ["Read in ultra-detail and perform the section only mentally", "Play it fast once", "Memorize immediately", "Play hands together"], "correct": 0, "explanation": "Mental performance before physical playing builds understanding of how the section works."}, {"question": "When should memorization begin?", "options": ["After one month", "Immediately, by detaching from the score from day one", "Only once optimized", "After the concert is scheduled"], "correct": 1, "explanation": "Memorization is integrated into the first pass, not postponed to a later phase."}, {"question": "Why attempt recall before looking back at the score?", "options": ["It saves time", "It is less tiring", "Effortful retrieval builds far stronger memory than re-reading", "It avoids mistakes"], "correct": 2, "explanation": "The testing effect shows effortful retrieval consolidates memory more than passive review."}, {"question": "Why optimize with the final tempo in mind?", "options": ["It sounds more impressive", "It is faster to learn", "The final tempo is the guide for your motor patterns", "It avoids tension"], "correct": 2, "explanation": "Motor patterns are best built toward their target execution conditions from the outset."}] },
      { id: '2.6', vimeoId: '1196632304', title: 'Cognitive load for faster reading', instructor: 'Michelangelo Salamone', duration: null, theory: "<p><strong>The principle.</strong> Cognitive load theory, applied to reading, yields a counterintuitive rule: to improve reading of complex tasks, train on <em>harder</em> material before tackling simpler ones. If you want to read a Mozart sonata fluently — easy to read, though very hard to perform — you start by reading something far more difficult. The brain adapts to handling a higher cognitive load, and that adaptation makes the simpler task easier afterward.</p><p>The mechanism is the <em>expertise reversal effect</em>: once your perceptual system is accustomed to decoding high-density notation — contemporary works, complex rhythms, Rachmaninov-level clusters — it manages information more simultaneously and more quickly. Returning to a simpler score, the task becomes far less demanding because the system is already trained to a higher load. The lesson demonstrates this directly with three scores in sequence: Ligeti's <em>L'Escalier du diable</em> (extremely dense), then a Chopin sonata, then a Mozart sonata. After the Ligeti, the Chopin feels difficult but manageable; after both, the Mozart feels genuinely easy — not only because Mozart is easy to read, but because the brain has adapted upward.</p><p><strong>What the science says.</strong> This rests on <strong>cognitive load theory</strong> (Sweller) and the documented <strong>expertise reversal effect</strong>, which describes how instructional difficulty interacts with learner expertise. Training visual and auditory working memory on high-density material expands the capacity to manage information simultaneously — consistent with working-memory research on how practiced perceptual systems chunk and process more per fixation. The descending-difficulty sequence is a deliberate way to raise the baseline before performing the target task.</p><p><strong>— Experiential Exercise —</strong></p><p>Build a descending-difficulty reading ladder of three pieces: one extremely dense (a contemporary or maximally complex score), one moderately hard, one genuinely simple. Read the hardest first — one minute, mentally decoding, not necessarily playing — then the middle, then the easy one, one minute each. Pay attention to how the easy score feels at the end compared with how it would feel cold. You will register the adaptation directly: the simple task becomes nearly effortless because your perceptual system has been pulled up to a higher load. Use this as a warm-up before reading sessions on your actual repertoire.</p>", attachments: [], quiz: [{"question": "What does cognitive load theory suggest for improving reading?", "options": ["Always start easy and build up", "Train on harder tasks before tackling simpler ones", "Read only at your current level", "Avoid difficult scores"], "correct": 1, "explanation": "Adapting the brain to a higher load makes simpler tasks easier afterward."}, {"question": "What is the expertise reversal effect here?", "options": ["Experts reading worse than beginners", "The brain adapts to higher cognitive load, improving its handling of less complex tasks", "Difficult pieces becoming impossible", "Reversing fingering"], "correct": 1, "explanation": "Once accustomed to dense notation, the perceptual system manages simpler material more easily."}, {"question": "In what order are the three demonstration scores read?", "options": ["Mozart, Chopin, Ligeti", "Chopin, Ligeti, Mozart", "Ligeti, then Chopin, then Mozart (hardest to easiest)", "All at once"], "correct": 2, "explanation": "The descending-difficulty sequence raises the baseline so the final easy task feels effortless."}, {"question": "Why does the Mozart feel easy at the end of the sequence?", "options": ["Only because Mozart is simple", "Not only because Mozart is easy to read, but because the brain has adapted upward to higher density", "Because it was played twice", "Because of fatigue"], "correct": 1, "explanation": "The prior dense reading expands the capacity to process information, lowering the felt demand."}, {"question": "Which theory underlies this approach?", "options": ["Goal-setting theory", "Motor imagery", "Cognitive load theory (Sweller)", "Parkinson's Law"], "correct": 2, "explanation": "Cognitive load theory and the expertise reversal effect explain training high to lower difficulty."}] }
