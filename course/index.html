<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PianoMind — Course</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
  <script src="https://player.vimeo.com/api/player.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --navy: #080D1A;
      --blue: #1B3A6B;
      --teal: #1D9E75;
      --gold: #D4A574;
      --g50:  #F9FAFB;
      --g100: #F3F4F6;
      --g200: #E5E7EB;
      --g400: #9CA3AF;
      --g500: #6B7280;
      --g600: #4B5563;
      --hdr:  60px;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--g50);
      color: var(--navy);
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
    }

    :focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

    /* ── Header ─────────────────────────────────────────────── */
    .hdr {
      position: fixed; top: 0; left: 0; right: 0; height: var(--hdr);
      background: var(--navy);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 24px; z-index: 1000;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .hdr-left  { display: flex; align-items: center; gap: 14px; }
    .hdr-right { display: flex; align-items: center; gap: 12px; }

    .hdr-menu-btn {
      display: none; align-items: center; justify-content: center;
      width: 36px; height: 36px; border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.12);
      background: none; color: rgba(255,255,255,0.65); cursor: pointer;
      transition: border-color .2s, color .2s;
    }
    .hdr-menu-btn:hover { border-color: rgba(255,255,255,0.3); color: white; }

    .hdr-brand { display: flex; align-items: center; gap: 10px; text-decoration: none; }
    .hdr-brand img { height: 22px; width: auto; filter: brightness(0) invert(1); opacity: 0.85; }
    .hdr-brand-name { font-family: 'Playfair Display', serif; font-size: 15px; font-weight: 500; color: white; }
    .hdr-sep { width: 1px; height: 14px; background: rgba(255,255,255,0.12); }
    .hdr-label {
      font-family: 'DM Mono', monospace; font-size: 9px;
      letter-spacing: 0.14em; text-transform: uppercase; color: rgba(255,255,255,0.38);
    }

    .hdr-progress { display: flex; align-items: center; gap: 10px; }
    .hdr-progress-label {
      font-family: 'DM Mono', monospace; font-size: 9px;
      letter-spacing: 0.1em; color: rgba(255,255,255,0.38); white-space: nowrap;
    }
    .hdr-track {
      width: 100px; height: 3px;
      background: rgba(255,255,255,0.1); border-radius: 99px; overflow: hidden;
    }
    .hdr-fill {
      height: 100%; width: 0%; border-radius: 99px;
      background: linear-gradient(90deg, var(--teal), #28C78F);
      transition: width .6s ease;
    }
    .hdr-pct {
      font-family: 'DM Mono', monospace; font-size: 10px;
      color: var(--teal); min-width: 28px; text-align: right;
    }

    /* ── Layout grid ─────────────────────────────────────────── */
    .layout {
      display: grid;
      grid-template-columns: 65fr 35fr;
      min-height: calc(100vh - var(--hdr));
      padding-top: var(--hdr);
    }

    /* ── Left column ─────────────────────────────────────────── */
    .col-main { overflow-y: auto; }

    /* ── Player ──────────────────────────────────────────────── */
    .player-wrap {
      background: #070B16;
      border-radius: 0 0 12px 12px;
      overflow: hidden;
      box-shadow: 0 8px 32px rgba(8,13,26,0.18);
    }
    .player-ratio {
      width: 100%; padding-top: 56.25%; position: relative;
      background: #070B16;
    }
    .player-ratio > * {
      position: absolute; inset: 0; width: 100%; height: 100%;
    }
    .player-ratio iframe { border: none; }

    .player-welcome {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 14px;
    }
    .pw-ring {
      width: 60px; height: 60px; border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.08);
      display: flex; align-items: center; justify-content: center;
    }
    .pw-text {
      font-family: 'Playfair Display', serif; font-style: italic;
      font-size: 16px; color: rgba(255,255,255,0.22);
    }

    .player-locked {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 10px;
      background: rgba(8,13,26,0.9); backdrop-filter: blur(12px);
    }
    .pl-icon { font-size: 28px; opacity: 0.5; }
    .pl-title {
      font-family: 'Playfair Display', serif; font-size: 18px;
      font-weight: 500; color: white; opacity: 0.6;
    }
    .pl-sub {
      font-family: 'DM Sans', sans-serif; font-size: 13px;
      color: rgba(255,255,255,0.38); text-align: center; max-width: 280px; line-height: 1.6;
    }

    .player-coming-soon {
      display: flex; align-items: center; justify-content: center;
      background: var(--navy);
    }
    .player-coming-soon p {
      font-family: 'DM Sans', sans-serif; font-size: 18px;
      color: var(--g500); text-align: center; max-width: 340px; line-height: 1.6;
      padding: 0 24px;
    }

    /* ── Content area (padded) ───────────────────────────────── */
    .col-inner { padding: 24px 32px 80px; }

    /* ── Author + next ───────────────────────────────────────── */
    .author-row {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 18px; gap: 12px;
    }
    .author-l { display: flex; align-items: center; gap: 12px; }
    .author-avatar {
      width: 40px; height: 40px; border-radius: 50%;
      object-fit: cover; background: var(--g200); flex-shrink: 0;
      border: 2px solid var(--g200);
    }
    .author-text { font-family: 'DM Sans', sans-serif; font-size: 14px; color: var(--g600); }
    .author-text strong { color: var(--navy); font-weight: 600; }

    .btn-next {
      display: inline-flex; align-items: center; gap: 6px;
      background: transparent; border: 1px solid var(--gold);
      color: var(--gold); font-family: 'DM Sans', sans-serif;
      font-size: 13px; font-weight: 500; letter-spacing: 0.08em;
      text-transform: uppercase; padding: 8px 20px; border-radius: 6px;
      cursor: pointer; white-space: nowrap; flex-shrink: 0;
      transition: background .2s, color .2s;
    }
    .btn-next:hover { background: var(--gold); color: var(--navy); }

    /* ── Lesson info ─────────────────────────────────────────── */
    .lesson-title {
      font-family: 'Playfair Display', serif;
      font-size: clamp(22px, 2.4vw, 32px);
      font-weight: 700; line-height: 1.2; color: var(--navy);
      margin-bottom: 12px;
    }
    .lesson-desc {
      font-family: 'DM Sans', sans-serif;
      font-size: 16px; line-height: 1.75; color: var(--g600);
    }

    /* ── Complete banner ─────────────────────────────────────── */
    .complete-banner {
      display: none; flex-direction: column; align-items: center;
      text-align: center; padding: 48px 32px; gap: 10px;
      margin-top: 32px;
    }
    .complete-banner.is-visible { display: flex; }
    .cb-icon { font-size: 32px; margin-bottom: 4px; }
    .cb-title { font-family: 'Playfair Display', serif; font-size: 22px; font-style: italic; font-weight: 500; color: var(--navy); }
    .cb-sub { font-family: 'DM Sans', sans-serif; font-size: 14px; color: var(--g500); }

    /* ── Right sidebar ───────────────────────────────────────── */
    .col-sidebar {
      background: white; border-left: 1px solid var(--g200);
      height: calc(100vh - var(--hdr)); position: sticky; top: var(--hdr);
      overflow-y: auto; overflow-x: hidden;
      scrollbar-width: thin; scrollbar-color: var(--g200) transparent;
      padding: 20px;
    }
    .col-sidebar::-webkit-scrollbar { width: 4px; }
    .col-sidebar::-webkit-scrollbar-thumb { background: var(--g200); border-radius: 2px; }

    /* ── Overall progress ────────────────────────────────────── */
    .prog-row {
      display: flex; align-items: center; gap: 16px;
      margin-bottom: 20px; padding-bottom: 20px;
      border-bottom: 1px solid var(--g200);
    }
    .prog-text {
      flex: 1; font-family: 'DM Sans', sans-serif;
      font-size: 14px; color: var(--g600); line-height: 1.4;
    }

    /* ── Module cards ────────────────────────────────────────── */
    .mod-card {
      background: white; border: 1px solid var(--g200);
      border-radius: 12px; overflow: hidden; margin-bottom: 12px;
    }
    .mod-card-hdr {
      padding: 16px 20px; background: var(--g50);
      border-bottom: 1px solid var(--g200);
    }
    .mod-card-top {
      display: flex; justify-content: space-between; align-items: flex-start;
      margin-bottom: 8px;
    }
    .mod-name {
      font-family: 'Playfair Display', serif; font-size: 15px;
      color: var(--navy); font-weight: 500; line-height: 1.3; flex: 1;
    }
    .mod-dur {
      font-family: 'DM Sans', sans-serif; font-size: 13px; color: var(--g500);
      flex-shrink: 0; padding-left: 8px;
    }
    .mod-tags { display: flex; gap: 6px; flex-wrap: wrap; }
    .mod-tag {
      font-family: 'DM Sans', sans-serif; font-size: 11px; font-weight: 500;
      letter-spacing: 0.08em; text-transform: uppercase;
      padding: 3px 8px; border-radius: 4px;
    }

    /* ── Lesson rows ─────────────────────────────────────────── */
    .lr {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 20px; border-top: 1px solid var(--g100);
      cursor: pointer; min-height: 64px;
      transition: background .15s;
    }
    .lr:hover:not(.lr--locked) { background: var(--g50); }
    .lr.lr--active { background: #EEF2FF; }
    .lr.lr--locked { opacity: 0.5; cursor: not-allowed; }
    .lr.lr--coming-soon { opacity: 0.5; cursor: pointer; }
    .lr.lr--coming-soon:hover { background: var(--g50); opacity: 0.65; }

    .lr-icon { flex-shrink: 0; }
    .lr-info { flex: 1; min-width: 0; }
    .lr-title {
      display: block; font-family: 'DM Sans', sans-serif;
      font-size: 14px; color: var(--navy); font-weight: 400;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .lr--active .lr-title { font-weight: 600; }
    .lr--locked .lr-title,
    .lr--coming-soon .lr-title { color: var(--g400); }
    .lr-dur {
      display: block; font-family: 'DM Sans', sans-serif;
      font-size: 13px; color: var(--g500); margin-top: 1px;
    }

    /* ── Mobile ──────────────────────────────────────────────── */
    .sidebar-backdrop {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.55); z-index: 490;
    }
    .sidebar-backdrop.is-visible { display: block; }

    @media (max-width: 1023px) {
      .layout { grid-template-columns: 60fr 40fr; }
    }

    @media (max-width: 767px) {
      .layout { grid-template-columns: 1fr; }
      .col-inner { padding: 20px 16px 60px; }

      .hdr-menu-btn { display: flex; }
      .hdr-track { width: 70px; }
      .hdr-sep, .hdr-label { display: none; }

      .player-wrap { border-radius: 0; box-shadow: none; }

      .col-sidebar {
        position: fixed; top: var(--hdr); right: 0;
        width: min(360px, 92vw); height: calc(100vh - var(--hdr));
        transform: translateX(100%); z-index: 500; border-left: none;
        box-shadow: none;
        transition: transform .32s cubic-bezier(.4,0,.2,1);
      }
      .col-sidebar.is-open {
        transform: translateX(0);
        box-shadow: -4px 0 24px rgba(0,0,0,0.14);
      }

      .lesson-title { font-size: 22px; }
      .lesson-desc  { font-size: 15px; }
    }
  </style>
</head>
<body>

<div class="sidebar-backdrop" id="backdrop"></div>

<header class="hdr">
  <div class="hdr-left">
    <button class="hdr-menu-btn" id="menuBtn" aria-label="Open course content">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
        <line x1="1" y1="4" x2="15" y2="4"/>
        <line x1="1" y1="8" x2="15" y2="8"/>
        <line x1="1" y1="12" x2="15" y2="12"/>
      </svg>
    </button>
    <a href="../" class="hdr-brand">
      <img src="../brand-assets/logo.png" alt="PianoPro" onerror="this.style.display='none'">
      <span class="hdr-brand-name">PianoPro</span>
    </a>
    <div class="hdr-sep"></div>
    <span class="hdr-label">PianoMind</span>
  </div>
  <div class="hdr-right">
    <div class="hdr-progress">
      <span class="hdr-progress-label">Progress</span>
      <div class="hdr-track"><div class="hdr-fill" id="hdrFill"></div></div>
      <span class="hdr-pct" id="hdrPct">0%</span>
    </div>
  </div>
</header>

<div class="layout">

  <!-- ── LEFT COLUMN ─────────────────────────────────────────── -->
  <div class="col-main" id="mainArea">

    <div class="player-wrap">
      <div class="player-ratio" id="playerRatio">
        <div class="player-welcome" id="playerWelcome">
          <div class="pw-ring">
            <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
              <circle cx="11" cy="11" r="9" stroke="rgba(255,255,255,0.18)" stroke-width="1"/>
              <polygon points="9,7 17,11 9,15" fill="rgba(255,255,255,0.22)"/>
            </svg>
          </div>
          <p class="pw-text">Select a lesson to begin</p>
        </div>
      </div>
    </div>

    <div class="col-inner">

      <!-- Author + next lesson -->
      <div class="author-row">
        <div class="author-l">
          <img class="author-avatar" id="authorAvatar" src="" alt="" onerror="this.style.background='var(--g200)'">
          <span class="author-text">Instructor: <strong id="authorName">—</strong></span>
        </div>
        <button class="btn-next" id="nextBtn" style="display:none" aria-label="Go to next lesson">
          Next Lesson
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <line x1="2" y1="6" x2="10" y2="6"/>
            <polyline points="7,3 10,6 7,9"/>
          </svg>
        </button>
      </div>

      <!-- Lesson title -->
      <h1 class="lesson-title" id="lessonTitle">Select a lesson to begin</h1>

      <!-- Lesson description -->
      <p class="lesson-desc" id="lessonDesc">Choose a lesson from the curriculum on the right to start watching.</p>

      <!-- Complete banner -->
      <div class="complete-banner" id="completeBanner">
        <div class="cb-icon">🎹</div>
        <p class="cb-title">Course complete.</p>
        <p class="cb-sub">You've completed all lessons in PianoMind.</p>
      </div>

    </div>
  </div>

  <!-- ── RIGHT SIDEBAR ──────────────────────────────────────── -->
  <aside class="col-sidebar" id="sidebar">

    <div class="prog-row">
      <div class="prog-text" id="progressText">0 of 18 lessons completed</div>
      <svg width="44" height="44" viewBox="0 0 44 44" aria-hidden="true" style="flex-shrink:0">
        <circle cx="22" cy="22" r="18" fill="none" stroke="#E5E7EB" stroke-width="4"/>
        <circle cx="22" cy="22" r="18" fill="none" stroke="#E5E7EB" stroke-width="4"
          stroke-dasharray="0 113.1" stroke-linecap="round"
          transform="rotate(-90 22 22)" id="overallRingFill"/>
      </svg>
    </div>

    <div id="moduleList"></div>

  </aside>

</div>

<script>
/* ═══════════════════════════════════════════════════════════════
   CONFIGURATION
═══════════════════════════════════════════════════════════════ */
const VIDEO_PROVIDER  = 'vimeo'; // 'vimeo' | 'bunny'
const STORAGE_KEY     = 'pm_progress_v1';
const LAST_KEY        = 'pm_last_v1';
const UNLOCK_PCT      = 80;
const SAVE_INTERVAL   = 10_000;

/* ═══════════════════════════════════════════════════════════════
   COURSE DATA
═══════════════════════════════════════════════════════════════ */
const modules = [
  {
    id: 1,
    title: 'Piano Practice and Productivity Principles',
    description: 'Evidence-based strategies for structuring practice sessions, setting measurable goals, and building sustainable habits. Grounded in cognitive science research on skill acquisition and deliberate practice.',
    tag1: { label: 'FOUNDATIONS', bg: '#1D9E75', color: '#FFFFFF' },
    tag2: { label: 'MODULE 1',    bg: '#D4A574', color: '#080D1A' },
    lessons: [
      { id: '1.1', vimeoId: '1190747389', title: 'Intro',                    instructor: 'Michelangelo Salamone', duration: null },
      { id: '1.2', vimeoId: '1190747443', title: 'Macrogoals and Micro Goals', instructor: 'Michelangelo Salamone', duration: null },
      { id: '1.3', vimeoId: '1190747481', title: 'Do It Well and Do It Now',  instructor: 'Michelangelo Salamone', duration: null },
      { id: '1.4', vimeoId: '1190747511', title: 'Deadlines',                 instructor: 'Michelangelo Salamone', duration: null },
      { id: '1.5', vimeoId: '1190747591', title: 'Productivity Habits',       instructor: 'Michelangelo Salamone', duration: null },
      { id: '1.6', vimeoId: '1190747621', title: 'Habits',                    instructor: 'Michelangelo Salamone', duration: null }
    ]
  },
  {
    id: 2,
    title: 'Reading',
    description: 'Systematic approaches to sight-reading and score analysis, developing fluency and structural comprehension across styles and periods.',
    tag1: { label: 'SKILLS',   bg: '#1B3A6B', color: '#FFFFFF' },
    tag2: { label: 'MODULE 2', bg: '#D4A574', color: '#080D1A' },
    lessons: [
      { id: '2.1', vimeoId: 'PLACEHOLDER', title: 'Lesson 2.1', instructor: 'Michelangelo Salamone', duration: null }, // PLACEHOLDER
      { id: '2.2', vimeoId: 'PLACEHOLDER', title: 'Lesson 2.2', instructor: 'Michelangelo Salamone', duration: null }, // PLACEHOLDER
      { id: '2.3', vimeoId: 'PLACEHOLDER', title: 'Lesson 2.3', instructor: 'Michelangelo Salamone', duration: null }  // PLACEHOLDER
    ]
  },
  {
    id: 3,
    title: 'Problem Solving and Repertoire Optimization',
    description: 'Diagnostic frameworks for identifying technical obstacles and selecting practice strategies matched to the specific demands of the repertoire.',
    tag1: { label: 'APPLIED',  bg: '#1D9E75', color: '#FFFFFF' },
    tag2: { label: 'MODULE 3', bg: '#D4A574', color: '#080D1A' },
    lessons: [
      { id: '3.1', vimeoId: 'PLACEHOLDER', title: 'Lesson 3.1', instructor: 'Michelangelo Salamone', duration: null }, // PLACEHOLDER
      { id: '3.2', vimeoId: 'PLACEHOLDER', title: 'Lesson 3.2', instructor: 'Michelangelo Salamone', duration: null }, // PLACEHOLDER
      { id: '3.3', vimeoId: 'PLACEHOLDER', title: 'Lesson 3.3', instructor: 'Michelangelo Salamone', duration: null }  // PLACEHOLDER
    ]
  },
  {
    id: 4,
    title: 'Memorization and Performance Preparation',
    description: 'Memory encoding strategies grounded in neuroscience, combined with structured performance preparation protocols to reduce performance anxiety and increase reliability.',
    tag1: { label: 'ADVANCED', bg: '#080D1A', color: '#FFFFFF' },
    tag2: { label: 'MODULE 4', bg: '#D4A574', color: '#080D1A' },
    lessons: [
      { id: '4.1', vimeoId: 'PLACEHOLDER', title: 'Lesson 4.1', instructor: 'Michelangelo Salamone', duration: null }, // PLACEHOLDER
      { id: '4.2', vimeoId: 'PLACEHOLDER', title: 'Lesson 4.2', instructor: 'Michelangelo Salamone', duration: null }, // PLACEHOLDER
      { id: '4.3', vimeoId: 'PLACEHOLDER', title: 'Lesson 4.3', instructor: 'Michelangelo Salamone', duration: null }  // PLACEHOLDER
    ]
  },
  {
    id: 5,
    title: 'Psychological Preparation',
    description: 'Applied sport psychology methods adapted for the concert stage, covering pre-performance routines, stress regulation, and recovery from errors during live performance.',
    tag1: { label: 'PSYCHOLOGY', bg: '#1B3A6B', color: '#FFFFFF' },
    tag2: { label: 'MODULE 5',   bg: '#D4A574', color: '#080D1A' },
    lessons: [
      { id: '5.1', vimeoId: 'PLACEHOLDER', title: 'Lesson 5.1', instructor: 'Michelangelo Salamone', duration: null }, // PLACEHOLDER
      { id: '5.2', vimeoId: 'PLACEHOLDER', title: 'Lesson 5.2', instructor: 'Michelangelo Salamone', duration: null }, // PLACEHOLDER
      { id: '5.3', vimeoId: 'PLACEHOLDER', title: 'Lesson 5.3', instructor: 'Michelangelo Salamone', duration: null }  // PLACEHOLDER
    ]
  }
];

/* Flat ordered list — derived once */
const ALL_LESSONS_DATA = modules.flatMap(m => m.lessons.map(l => ({ ...l, _mod: m })));
const ALL_LESSONS      = ALL_LESSONS_DATA.map(l => l.id); // 18 total

function getLessonData(id) {
  return ALL_LESSONS_DATA.find(l => l.id === id);
}
function isPlaceholder(id) {
  const l = getLessonData(id);
  return l ? l.vimeoId === 'PLACEHOLDER' : false;
}

/* ═══════════════════════════════════════════════════════════════
   STATE
═══════════════════════════════════════════════════════════════ */
let prog      = {};
let activeId  = null;
let playingId = null;

/* ── Persistence ─────────────────────────────────────────── */
function loadProg() {
  try { prog = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; } catch { prog = {}; }
}
function saveProg() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(prog)); } catch {}
}
function getProg(id) {
  return prog[id] || { currentTime: 0, duration: 0, percentWatched: 0 };
}

/* ── Unlock logic ─────────────────────────────────────────── */
function isUnlocked(id) {
  if (isPlaceholder(id)) return false;
  const idx = ALL_LESSONS.indexOf(id);
  if (idx <= 0) return true;
  return getProg(ALL_LESSONS[idx - 1]).percentWatched >= UNLOCK_PCT;
}
function nextLesson(id) {
  const idx = ALL_LESSONS.indexOf(id);
  return (idx >= 0 && idx < ALL_LESSONS.length - 1) ? ALL_LESSONS[idx + 1] : null;
}
function prevLesson(id) {
  const idx = ALL_LESSONS.indexOf(id);
  return idx > 0 ? ALL_LESSONS[idx - 1] : null;
}
function completedCount() {
  return ALL_LESSONS.filter(id => !isPlaceholder(id) && getProg(id).percentWatched >= UNLOCK_PCT).length;
}
function totalReal() {
  return ALL_LESSONS.filter(id => !isPlaceholder(id)).length;
}
function overallPct() {
  const real = totalReal();
  return real > 0 ? Math.round((completedCount() / real) * 100) : 0;
}

/* ═══════════════════════════════════════════════════════════════
   PLAYER
═══════════════════════════════════════════════════════════════ */
function renderPlayer(id) {
  const lesson = getLessonData(id);
  if (!lesson || isPlaceholder(id)) return '';

  if (VIDEO_PROVIDER === 'vimeo') {
    return `<iframe
      src="https://player.vimeo.com/video/${lesson.vimeoId}?title=0&byline=0&portrait=0&badge=0&autopause=0&dnt=1&player_id=0&app_id=58479"
      frameborder="0"
      allow="autoplay; fullscreen; picture-in-picture; clipboard-write; encrypted-media; web-share"
      referrerpolicy="strict-origin-when-cross-origin"
      allowfullscreen
      style="position:absolute;top:0;left:0;width:100%;height:100%;"></iframe>`;
  }
  return '';
}

function loadLesson(id) {
  const lesson = getLessonData(id);
  if (!lesson) return;

  activeId  = id;
  playingId = id;

  document.getElementById('playerRatio').innerHTML = renderPlayer(id);

  if (VIDEO_PROVIDER === 'vimeo') {
    _initVimeo(id);
  }

  _updateLessonInfo(id);
  renderModuleList();
  updateOverallProgress();

  document.getElementById('mainArea').scrollTo({ top: 0, behavior: 'smooth' });
  closeSidebar();
}

function _initVimeo(id) {
  const iframe = document.querySelector('#playerRatio iframe');
  if (!iframe) return;

  if (window._vimeoPlayer) {
    try { window._vimeoPlayer.destroy(); } catch {}
    window._vimeoPlayer = null;
  }

  window._vimeoPlayer = new Vimeo.Player(iframe);
  const player = window._vimeoPlayer;

  const startT = Math.floor(getProg(id).currentTime || 0);
  if (startT > 5) {
    player.ready().then(() => player.setCurrentTime(startT)).catch(() => {});
  }

  player.on('timeupdate', data => onTimeUpdate(data.seconds, data.duration));
  player.on('ended', () => onEnded());

  player.getDuration().then(dur => {
    const lesson = getLessonData(id);
    if (lesson) {
      lesson.duration = dur;
      renderModuleList();
    }
  }).catch(() => {});
}

function showLocked(id) {
  activeId  = id;
  playingId = null;

  const prev = prevLesson(id);
  const prevLesson_ = prev ? getLessonData(prev) : null;
  const msg = prevLesson_
    ? `Complete "${prevLesson_.title}" to unlock this lesson.`
    : 'Complete the previous lesson to unlock this one.';

  document.getElementById('playerRatio').innerHTML = `
    <div class="player-locked">
      <div class="pl-icon">🔒</div>
      <p class="pl-title">Lesson locked</p>
      <p class="pl-sub">${msg}</p>
    </div>`;

  renderModuleList();
  closeSidebar();
}

function showComingSoon(id) {
  activeId  = id;
  playingId = null;

  document.getElementById('playerRatio').innerHTML = `
    <div class="player-coming-soon">
      <p>This lesson is not yet available. Check back soon.</p>
    </div>`;

  const lesson = getLessonData(id);
  if (lesson) {
    document.getElementById('lessonTitle').textContent = lesson.title;
    document.getElementById('lessonDesc').textContent  = lesson._mod.description || '';
    document.getElementById('authorName').textContent  = lesson.instructor;
    const avatar = document.getElementById('authorAvatar');
    avatar.src = '../brand-assets/Michelangelo.png';
    avatar.alt = lesson.instructor;
    document.getElementById('nextBtn').style.display = 'none';
  }

  renderModuleList();
  closeSidebar();
}

function handleLessonClick(id) {
  if (isPlaceholder(id)) {
    showComingSoon(id);
  } else if (!isUnlocked(id)) {
    showLocked(id);
  } else {
    loadLesson(id);
  }
}

/* ═══════════════════════════════════════════════════════════════
   LEFT COLUMN UPDATES
═══════════════════════════════════════════════════════════════ */
function _updateLessonInfo(id) {
  const lesson = getLessonData(id);
  if (!lesson) return;

  document.getElementById('lessonTitle').textContent = lesson.title;
  document.getElementById('lessonDesc').textContent  = lesson._mod.description || '';
  document.getElementById('authorName').textContent  = lesson.instructor;

  const avatar = document.getElementById('authorAvatar');
  avatar.src = lesson.instructor === 'Michelangelo Salamone'
    ? '../brand-assets/Michelangelo.png'
    : '../brand-assets/Heather.png';
  avatar.alt = lesson.instructor;

  const next    = nextLesson(id);
  const nextBtn = document.getElementById('nextBtn');
  if (next) {
    nextBtn.style.display = '';
    nextBtn.onclick = () => handleLessonClick(next);
  } else {
    nextBtn.style.display = 'none';
  }

  const realLessons = ALL_LESSONS.filter(lid => !isPlaceholder(lid));
  const allDone = realLessons.every(lid => getProg(lid).percentWatched >= UNLOCK_PCT);
  document.getElementById('completeBanner').classList.toggle('is-visible', !next && allDone);
}

/* ═══════════════════════════════════════════════════════════════
   SIDEBAR: MODULE LIST
═══════════════════════════════════════════════════════════════ */
function renderModuleList() {
  const container = document.getElementById('moduleList');
  container.innerHTML = '';

  modules.forEach(mod => {
    const totalSec = mod.lessons.reduce((s, l) => s + (l.duration || 0), 0);
    const h = Math.floor(totalSec / 3600);
    const m = Math.floor((totalSec % 3600) / 60);
    const durLabel = totalSec > 0 ? (h > 0 ? `${h}h ${m}m` : `${m}m`) : '';

    const lessonsHtml = mod.lessons.map(l => _makeLessonRow(l)).join('');

    const card = document.createElement('div');
    card.className = 'mod-card';
    card.id = 'mod-' + mod.id;
    card.innerHTML = `
      <div class="mod-card-hdr">
        <div class="mod-card-top">
          <span class="mod-name">${mod.title}</span>
          ${durLabel ? `<span class="mod-dur">${durLabel}</span>` : ''}
        </div>
        <div class="mod-tags">
          <span class="mod-tag" style="background:${mod.tag1.bg};color:${mod.tag1.color}">${mod.tag1.label}</span>
          <span class="mod-tag" style="background:${mod.tag2.bg};color:${mod.tag2.color}">${mod.tag2.label}</span>
        </div>
      </div>
      <div class="mod-lessons">${lessonsHtml}</div>`;

    /* Attach click to every lesson row — handleLessonClick routes correctly */
    mod.lessons.forEach(l => {
      const row = card.querySelector('#lr-' + l.id.replace('.', '_'));
      if (row) {
        row.addEventListener('click', () => handleLessonClick(l.id));
        row.addEventListener('keydown', e => { if (e.key === 'Enter') handleLessonClick(l.id); });
      }
    });

    container.appendChild(card);
  });
}

function _makeLessonRow(lesson) {
  const id       = lesson.id;
  const p        = getProg(id);
  const placeholder = isPlaceholder(id);
  const unlocked = !placeholder && isUnlocked(id);
  const done     = !placeholder && p.percentWatched >= UNLOCK_PCT;
  const isActive = activeId === id;
  const pct      = p.percentWatched || 0;

  const dur    = lesson.duration;
  const durStr = dur ? `${Math.floor(dur / 60)}:${String(Math.floor(dur % 60)).padStart(2, '0')}` : '--:--';

  let cls = 'lr';
  if (isActive) cls += ' lr--active';
  if (placeholder) {
    cls += ' lr--coming-soon';
  } else if (!unlocked) {
    cls += ' lr--locked';
  }
  if (done) cls += ' lr--done';

  const safeId   = id.replace('.', '_');
  const tabindex = (unlocked || placeholder) ? '0' : '-1';
  const role     = (unlocked || placeholder) ? `role="button" aria-label="Play ${lesson.title}"` : 'aria-disabled="true"';

  return `
    <div class="${cls}" id="lr-${safeId}" tabindex="${tabindex}" ${role}>
      <div class="lr-icon">${_makeLessonIcon(unlocked, done, isActive, pct, safeId, placeholder)}</div>
      <div class="lr-info">
        <span class="lr-title">${lesson.title}</span>
        <span class="lr-dur">${durStr}</span>
      </div>
    </div>`;
}

function _makeLessonIcon(unlocked, done, isActive, pct, safeId, placeholder) {
  if (!unlocked || placeholder) {
    return `<svg width="32" height="32" viewBox="0 0 32 32" aria-hidden="true">
      <circle cx="16" cy="16" r="14" fill="white" stroke="#D1D5DB" stroke-width="2"/>
      <rect x="11" y="15" width="10" height="8" rx="2" fill="#9CA3AF"/>
      <path d="M13 15v-3a3 3 0 0 1 6 0v3" stroke="#9CA3AF" stroke-width="2" fill="none" stroke-linecap="round"/>
    </svg>`;
  }
  if (done) {
    return `<svg width="32" height="32" viewBox="0 0 32 32" aria-hidden="true">
      <circle cx="16" cy="16" r="16" fill="#1D9E75"/>
      <polyline points="10,16 14,20.5 22,12" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>`;
  }
  if (isActive) {
    const C    = 2 * Math.PI * 14;
    const dash = ((pct / 100) * C).toFixed(2);
    return `<svg width="32" height="32" viewBox="0 0 32 32" aria-hidden="true">
      <circle cx="16" cy="16" r="14" fill="none" stroke="#E5E7EB" stroke-width="2.5"/>
      <circle cx="16" cy="16" r="14" fill="none" stroke="#D4A574" stroke-width="2.5"
        stroke-dasharray="${dash} ${C.toFixed(2)}"
        transform="rotate(-90 16 16)" stroke-linecap="round" id="arc-${safeId}"/>
      <circle cx="16" cy="16" r="10" fill="white" stroke="#1B3A6B" stroke-width="2"/>
      <rect x="12.5" y="12" width="2.5" height="8" rx="1" fill="#1B3A6B"/>
      <rect x="17"   y="12" width="2.5" height="8" rx="1" fill="#1B3A6B"/>
    </svg>`;
  }
  return `<svg width="32" height="32" viewBox="0 0 32 32" aria-hidden="true">
    <circle cx="16" cy="16" r="14" fill="white" stroke="#1B3A6B" stroke-width="2"/>
    <polygon points="13.5,11.5 22.5,16 13.5,20.5" fill="#1B3A6B"/>
  </svg>`;
}

/* ═══════════════════════════════════════════════════════════════
   PROGRESS TRACKING
═══════════════════════════════════════════════════════════════ */
function onTimeUpdate(t, dur) {
  if (!playingId) return;
  const pct      = dur > 0 ? (t / dur) * 100 : 0;
  const existing = getProg(playingId);

  prog[playingId] = {
    currentTime:    t,
    duration:       dur,
    percentWatched: Math.max(pct, existing.percentWatched)
  };

  /* Update active-lesson arc in-place */
  const safeId = playingId.replace('.', '_');
  const arcEl  = document.getElementById('arc-' + safeId);
  if (arcEl) {
    const C = 2 * Math.PI * 14;
    arcEl.setAttribute('stroke-dasharray', `${((pct / 100) * C).toFixed(2)} ${C.toFixed(2)}`);
  }

  updateOverallProgress();
  if (pct >= UNLOCK_PCT) _onThresholdReached(playingId);
}

function onEnded() {
  if (!playingId) return;
  const p = getProg(playingId);
  prog[playingId] = { ...p, percentWatched: 100 };
  saveProg();
  renderModuleList();
  updateOverallProgress();
  if (activeId) _updateLessonInfo(activeId);
}

function _onThresholdReached(id) {
  renderModuleList();
  updateOverallProgress();
}

function updateOverallProgress() {
  const done = completedCount();
  const real = totalReal();
  const pct  = overallPct();

  document.getElementById('progressText').textContent = `${done} of ${real} lessons completed`;

  const C    = 2 * Math.PI * 18;
  const ring = document.getElementById('overallRingFill');
  if (ring) {
    ring.setAttribute('stroke-dasharray', `${((pct / 100) * C).toFixed(2)} ${C.toFixed(2)}`);
    ring.setAttribute('stroke', pct > 0 ? '#D4A574' : '#E5E7EB');
  }

  document.getElementById('hdrFill').style.width = pct + '%';
  document.getElementById('hdrPct').textContent  = pct + '%';
}

/* ═══════════════════════════════════════════════════════════════
   MOBILE SIDEBAR
═══════════════════════════════════════════════════════════════ */
document.getElementById('menuBtn').addEventListener('click', toggleSidebar);
document.getElementById('backdrop').addEventListener('click', closeSidebar);

function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('is-open');
  document.getElementById('backdrop').classList.toggle('is-visible');
}
function closeSidebar() {
  document.getElementById('sidebar').classList.remove('is-open');
  document.getElementById('backdrop').classList.remove('is-visible');
}

/* ═══════════════════════════════════════════════════════════════
   PERIODIC SAVE + UNLOAD
═══════════════════════════════════════════════════════════════ */
setInterval(() => { if (playingId) saveProg(); }, SAVE_INTERVAL);

window.addEventListener('beforeunload', () => {
  saveProg();
  if (activeId) {
    try { localStorage.setItem(LAST_KEY, activeId); } catch {}
  }
  if (window._vimeoPlayer) {
    try { window._vimeoPlayer.destroy(); } catch {}
  }
});

/* ═══════════════════════════════════════════════════════════════
   INIT
═══════════════════════════════════════════════════════════════ */
(function init() {
  loadProg();
  renderModuleList();
  updateOverallProgress();

  try {
    const last = localStorage.getItem(LAST_KEY);
    if (last && getLessonData(last) && !isPlaceholder(last) && isUnlocked(last)) {
      activeId = last;
      renderModuleList();
      _updateLessonInfo(last);
    }
  } catch {}
})();
</script>
</body>
